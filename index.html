<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#86c7ff" />
<title>BUILD — v0.1</title>
<style>
:root{color-scheme:light;--ink:#17314c;--muted:#68839b;--line:#c9dceb;--card:rgba(255,255,255,.92);--blue:#2388e8;--blue2:#5fb3ff;--good:#2d9d66;--danger:#d65050;--shadow:0 10px 30px rgba(41,81,118,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:linear-gradient(#bfe6ff,#edf8ff 40%,#d8f0da);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100vh;overflow-x:hidden}.app{max-width:980px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom))}.hud{display:flex;align-items:center;gap:8px}.brand{min-width:0;flex:1}.brand h1{font-size:20px;margin:0;letter-spacing:-.04em}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}.level{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}.resources{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.resource{background:var(--card);border:1px solid rgba(201,220,235,.9);border-radius:15px;padding:8px 9px;box-shadow:var(--shadow);min-width:0}.resource span{font-size:10px;color:var(--muted);display:block}.resource b{font-size:15px;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource i{font-style:normal;font-size:9px;color:var(--good)}.mission{margin:8px 0;background:rgba(255,255,255,.9);border:1px solid rgba(201,220,235,.9);border-radius:15px;padding:9px 11px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:10px;align-items:center}.mission strong{font-size:12px}.mission small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.mission .badge{font-size:11px;font-weight:800;color:var(--blue);white-space:nowrap}.game-shell{position:relative;border:1px solid rgba(126,173,205,.6);border-radius:24px;overflow:hidden;background:linear-gradient(#8ed0ff,#c6ecff 56%,#9ed28d 57%);box-shadow:0 18px 45px rgba(37,84,120,.18)}canvas{display:block;width:100%;height:auto;aspect-ratio:1.15;touch-action:manipulation}.hint{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:7px 9px;font-size:10px;color:#49677e;pointer-events:none}.buildbar{display:flex;gap:7px;overflow-x:auto;padding:9px 2px 4px;scrollbar-width:none}.buildbar::-webkit-scrollbar{display:none}.build{min-width:112px;min-height:72px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:8px 9px;text-align:left;color:var(--ink);position:relative}.build.active{border:2px solid var(--blue);padding:7px 8px;background:#f5fbff}.build.locked{opacity:.48}.build .icon{font-size:22px;line-height:1}.build strong{display:block;font-size:11px;margin-top:3px}.build small{display:block;color:var(--muted);font-size:9px;line-height:1.25;margin-top:2px}.tools{display:flex;gap:7px;margin-top:5px}.tool{flex:1;min-height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.93);color:var(--ink);font-weight:750;font-size:12px}.tool.danger.active{border-color:#e9a6a6;background:#fff2f2;color:var(--danger)}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -18px 60px rgba(31,63,90,.24);padding:14px 14px max(18px,env(safe-area-inset-bottom));z-index:5;display:none}.sheet.show{display:block}.sheet .grab{width:38px;height:4px;border-radius:999px;background:#d7e3eb;margin:0 auto 10px}.sheet h3{margin:0;font-size:16px}.sheet p{font-size:12px;color:var(--muted);margin:5px 0 12px}.sheet-actions{display:flex;gap:8px}.sheet button{flex:1;min-height:44px;border-radius:13px;border:1px solid var(--line);background:#f8fbfd;color:var(--ink);font-weight:750}.sheet .destroy{background:#fff2f2;border-color:#efc2c2;color:var(--danger)}.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);background:rgba(23,49,76,.94);color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;opacity:0;pointer-events:none;transition:.16s ease;z-index:9;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:720px){.app{padding-left:18px;padding-right:18px}.brand h1{font-size:25px}.resource b{font-size:18px}.game-shell{border-radius:28px}.buildbar{justify-content:center}.build{min-width:145px}}
</style>
</head>
<body>
<div class="app">
  <div class="hud"><div class="brand"><h1>BUILD</h1><p>Isometric city builder · v0.1</p></div><div class="level" id="level">Level 1</div></div>
  <div class="resources">
    <div class="resource"><span>🪙 Credits</span><b id="credits">0</b><i id="creditsRate"></i></div>
    <div class="resource"><span>🪵 Wood</span><b id="wood">0</b><i id="woodRate"></i></div>
    <div class="resource"><span>🌾 Food</span><b id="food">0</b><i id="foodRate"></i></div>
    <div class="resource"><span>👥 Population</span><b id="pop">0</b><i id="popRate"></i></div>
  </div>
  <div class="mission"><div><strong id="missionTitle">Found a settlement</strong><small id="missionText"></small></div><div class="badge" id="missionProgress"></div></div>
  <div class="game-shell">
    <canvas id="world" width="900" height="780" aria-label="Isometric city map"></canvas>
    <div class="hint" id="hint">Choose a building, then tap land</div>
  </div>
  <div class="buildbar" id="buildbar"></div>
  <div class="tools"><button class="tool" id="inspect">Inspect</button><button class="tool danger" id="bulldoze">Bulldoze</button><button class="tool" id="reset">New city</button></div>
</div>
<div class="sheet" id="sheet"><div class="grab"></div><h3 id="sheetTitle"></h3><p id="sheetBody"></p><div class="sheet-actions"><button id="sheetClose">Close</button><button class="destroy" id="sheetDestroy">Demolish</button></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const N=8,SAVE='build-v01-isometric';
const defs={
 house:{name:'House',icon:'🏠',cost:{credits:170,wood:28},gain:{pop:4},desc:'+4 population'},
 lumber:{name:'Lumber Yard',icon:'🪵',cost:{credits:240,food:18},rate:{wood:1.5},desc:'+1.5 wood/sec'},
 farm:{name:'Farm',icon:'🌾',cost:{credits:220,wood:22},rate:{food:1.35},desc:'+1.35 food/sec'},
 market:{name:'Market',icon:'🏪',cost:{credits:430,wood:36,food:24},rate:{credits:3.2},desc:'+3.2 credits/sec'}
};
const defaultState=()=>({credits:1000,wood:150,food:120,pop:5,level:1,grid:Array(N*N).fill(null),selected:'house',mode:'build',last:Date.now()});
let state=defaultState(); state.grid[3*N+3]='hq'; let selectedCell=null; let toastTimer=0; let t=0;
try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&Array.isArray(s.grid)&&s.grid.length===N*N)state={...defaultState(),...s,last:Date.now()}}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({...state,last:Date.now()}))}catch(e){}}
function count(type){return state.grid.filter(x=>x===type).length}
function rates(){const r={credits:0,wood:0,food:0};for(const b of state.grid){if(defs[b]?.rate)for(const [k,v] of Object.entries(defs[b].rate))r[k]+=v}return r}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':Math.floor(n).toString()}
function objective(){if(state.level===1)return{title:'Found a settlement',text:'Build 2 Houses, 1 Lumber Yard and 1 Farm',ok:count('house')>=2&&count('lumber')>=1&&count('farm')>=1,progress:`${Math.min(count('house'),2)+Math.min(count('lumber'),1)+Math.min(count('farm'),1)}/4`};if(state.level===2)return{title:'Grow the town',text:'Reach 17 population and build a Market',ok:state.pop>=17&&count('market')>=1,progress:`${Math.min(Math.floor(state.pop/17*50),50)+Math.min(count('market')*50,50)}%`};return{title:'Prosper',text:'Build 12 structures and earn 10 credits/sec',ok:false,progress:`${Math.min(count('house')+count('lumber')+count('farm')+count('market'),12)}/12`}}
function checkLevel(){const o=objective();if(o.ok&&state.level<3){state.level++;showToast('Level up! New building unlocked');save();renderUI()}}
function renderUI(){const r=rates();$('credits').textContent=fmt(state.credits);$('wood').textContent=fmt(state.wood);$('food').textContent=fmt(state.food);$('pop').textContent=fmt(state.pop);$('creditsRate').textContent=r.credits?`+${r.credits.toFixed(1)}/s`:'';$('woodRate').textContent=r.wood?`+${r.wood.toFixed(1)}/s`:'';$('foodRate').textContent=r.food?`+${r.food.toFixed(1)}/s`:'';$('popRate').textContent='';$('level').textContent='Level '+state.level;const o=objective();$('missionTitle').textContent=o.title;$('missionText').textContent=o.text;$('missionProgress').textContent=o.progress;$('hint').textContent=state.mode==='build'?`Build: ${defs[state.selected].name}`:state.mode==='bulldoze'?'Tap a building to demolish':'Tap a building to inspect';renderBuildbar()}
function renderBuildbar(){const bar=$('buildbar');bar.innerHTML='';for(const [key,d] of Object.entries(defs)){const locked=key==='market'&&state.level<2;const b=document.createElement('button');b.className='build'+(state.mode==='build'&&state.selected===key?' active':'')+(locked?' locked':'');b.disabled=locked;b.innerHTML=`<div class="icon">${d.icon}</div><strong>${d.name}</strong><small>${costText(d.cost)}<br>${d.desc}</small>`;b.addEventListener('click',()=>{state.selected=key;state.mode='build';selectedCell=null;renderUI()});bar.appendChild(b)}}
function costText(c){return Object.entries(c).map(([k,v])=>`${k==='credits'?'🪙':k==='wood'?'🪵':'🌾'} ${v}`).join(' · ')}
function canAfford(c){return Object.entries(c).every(([k,v])=>state[k]>=v)}
function spend(c){for(const[k,v]of Object.entries(c))state[k]-=v}
function refund(type){const c=defs[type]?.cost||{};for(const[k,v]of Object.entries(c))state[k]+=Math.floor(v*.35);if(defs[type]?.gain?.pop)state.pop=Math.max(0,state.pop-defs[type].gain.pop)}
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(600,Math.floor(rect.width*dpr));canvas.height=Math.floor(canvas.width/1.15);ctx.setTransform(dpr,0,0,dpr,0,0)}
function dims(){const w=canvas.clientWidth,h=canvas.clientHeight;const tw=Math.min(74,w/(N+1)*1.36),th=tw*.5;return{w,h,tw,th,ox:w/2,oy:Math.max(86,h*.16)}}
function iso(x,y,d){return{x:d.ox+(x-y)*d.tw/2,y:d.oy+(x+y)*d.th/2}}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function tilePoly(x,y,d){const p=iso(x,y,d);return[[p.x,p.y-d.th/2],[p.x+d.tw/2,p.y],[p.x,p.y+d.th/2],[p.x-d.tw/2,p.y]]}
function drawBackground(d){const g=ctx.createLinearGradient(0,0,0,d.h);g.addColorStop(0,'#8fd1ff');g.addColorStop(.48,'#d9f3ff');g.addColorStop(.49,'#79b9d7');g.addColorStop(.63,'#8acbd6');g.addColorStop(.64,'#77af6c');g.addColorStop(1,'#4f8754');ctx.fillStyle=g;ctx.fillRect(0,0,d.w,d.h);for(let i=0;i<4;i++){const cx=(i*237+t*4)%(d.w+180)-90,cy=32+(i%2)*28;ctx.globalAlpha=.65;ellipse(cx,cy,48,12,'white');ellipse(cx+30,cy-7,34,13,'white')}ctx.globalAlpha=1}
function drawIsland(d){const a=iso(0,0,d),b=iso(N-1,0,d),c=iso(N-1,N-1,d),e=iso(0,N-1,d);poly([[a.x,a.y-d.th*.72],[b.x+d.tw*.55,b.y],[c.x,c.y+d.th*.72+18],[e.x-d.tw*.55,e.y]],'#6b9d58');poly([[a.x,a.y-d.th*.62],[b.x+d.tw*.48,b.y],[c.x,c.y+d.th*.62],[e.x-d.tw*.48,e.y]],'#8fcf72')}
function noise(x,y){return ((x*73+y*151+x*y*37)%17)/17}
function drawTiles(d){for(let s=0;s<=2*(N-1);s++)for(let x=0;x<N;x++){const y=s-x;if(y<0||y>=N)continue;const p=iso(x,y,d),shade=noise(x,y);poly(tilePoly(x,y,d),shade>.5?'#94d477':'#8dce70','rgba(75,126,73,.35)');const type=state.grid[y*N+x];if(!type&&shade>.73&&!(Math.abs(x-3)<=1&&Math.abs(y-3)<=1))drawTree(p.x,p.y-d.th*.08,0.72+shade*.2);if(type)drawBuilding(type,p.x,p.y,d,x,y)}}
function drawTree(x,y,s=1){ellipse(x+5*s,y+8*s,13*s,5*s,'rgba(34,72,39,.18)');ctx.fillStyle='#70502f';ctx.fillRect(x-2*s,y-5*s,4*s,15*s);poly([[x,y-34*s],[x+17*s,y-8*s],[x-17*s,y-8*s]],'#2f8248');poly([[x,y-26*s],[x+20*s,y-2*s],[x-20*s,y-2*s]],'#399552')}
function box(x,y,w,h,z,top,left,right){ellipse(x+4,y+8,w*.48,h*.16,'rgba(28,61,35,.16)');poly([[x-w/2,y],[x,y+h/4],[x,y+h/4-z],[x-w/2,y-z]],left);poly([[x+w/2,y],[x,y+h/4],[x,y+h/4-z],[x+w/2,y-z]],right);poly([[x,y-h/4-z],[x+w/2,y-z],[x,y+h/4-z],[x-w/2,y-z]],top)}
function drawBuilding(type,x,y,d,gx,gy){if(type==='hq'){box(x,y,42,38,43,'#d5edf7','#8aaabd','#6f93aa');box(x,y-25,31,28,28,'#edf8ff','#9dbccc','#84a8ba');ctx.fillStyle='#536f80';ctx.fillRect(x-2,y-79,3,23);poly([[x+1,y-78],[x+19,y-72],[x+1,y-66]],'#ff6c5f');ctx.fillStyle='#4a6a7e';ctx.fillRect(x-5,y-29,10,16);return}
 if(type==='house'){box(x,y,38,31,25,'#f3e2b4','#d5bb8b','#c49e6e');poly([[x,y-54],[x+25,y-35],[x,y-18],[x-25,y-35]],'#cf5c4e','#9f4038');ctx.fillStyle='#7cc4e8';ctx.fillRect(x-5,y-15,9,10);ctx.fillStyle='#6d4b33';ctx.fillRect(x+9,y-10,7,12);return}
 if(type==='lumber'){box(x,y,43,32,17,'#b8c594','#84966e','#71845e');for(let i=-1;i<=1;i++){ctx.strokeStyle='#785136';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-15+i*10,y-6+i*2);ctx.lineTo(x+9+i*10,y+5+i*2);ctx.stroke()}drawTree(x-19,y-20,.55);return}
 if(type==='farm'){poly([[x,y-d.th*.42],[x+d.tw*.42,y],[x,y+d.th*.42],[x-d.tw*.42,y]],'#d6bd55','#a28f43');for(let i=-3;i<=3;i++)line(x-26+i*6,y+1-i*2,x+2+i*6,y+14-i*2,'#8b7834',2);box(x+14,y-5,25,20,18,'#e4d5ac','#b7906b','#9e7355');poly([[x+14,y-33],[x+29,y-22],[x+14,y-12],[x-1,y-22]],'#b64d44');return}
 if(type==='market'){box(x,y,42,34,20,'#f1e2ba','#c7aa80','#b99168');const aw='#f05656';poly([[x-24,y-24],[x+24,y-24],[x+18,y-14],[x-18,y-14]],aw);for(let i=-18;i<24;i+=12)poly([[x+i,y-24],[x+i+6,y-24],[x+i+3,y-14],[x+i-3,y-14]],'#fff1de');ctx.fillStyle='#6c4b31';ctx.fillRect(x-12,y-10,24,4);return}}
function drawPeople(d){const hq=iso(3,3,d);for(let i=0;i<Math.min(5,Math.floor(state.pop/4));i++){const a=t*.8+i*1.37,rx=28+10*(i%2),ry=12+4*(i%2);const x=hq.x+Math.cos(a)*rx,y=hq.y+15+Math.sin(a)*ry;ellipse(x,y+4,3,1.4,'rgba(28,51,41,.18)');ctx.fillStyle=i%2?'#f15f5f':'#3a83cc';ctx.fillRect(x-2,y-7,4,7);ellipse(x,y-9,2.5,2.5,'#f2c3a4')}}
function drawSelection(d){if(!selectedCell)return;const {x,y}=selectedCell;poly(tilePoly(x,y,d),'rgba(56,151,235,.22)','rgba(30,126,217,.95)')}
function render(){const d=dims();drawBackground(d);drawIsland(d);drawTiles(d);drawPeople(d);drawSelection(d);t+=.016;requestAnimationFrame(render)}
function pointIn(poly,x,y){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function hit(clientX,clientY){const r=canvas.getBoundingClientRect(),px=clientX-r.left,py=clientY-r.top,d=dims();for(let s=2*(N-1);s>=0;s--)for(let x=N-1;x>=0;x--){const y=s-x;if(y>=0&&y<N&&pointIn(tilePoly(x,y,d),px,py))return{x,y,index:y*N+x}}return null}
function handleCell(cell){if(!cell)return;selectedCell=cell;const type=state.grid[cell.index];if(state.mode==='build'){if(type){openSheet(cell,type);return}const d=defs[state.selected];if(!canAfford(d.cost)){showToast('Not enough resources');return}spend(d.cost);state.grid[cell.index]=state.selected;if(d.gain?.pop)state.pop+=d.gain.pop;showToast(`${d.name} built`);save();checkLevel();renderUI();return}if(state.mode==='bulldoze'){if(!type||type==='hq'){showToast(type==='hq'?'HQ cannot be demolished':'Nothing here');return}refund(type);state.grid[cell.index]=null;showToast('Building demolished · 35% refunded');save();renderUI();return}if(type)openSheet(cell,type);else showToast('Empty land')}
function openSheet(cell,type){selectedCell=cell;const d=defs[type];$('sheetTitle').textContent=type==='hq'?'Town Hall':d.name;$('sheetBody').textContent=type==='hq'?'The heart of your settlement. It cannot be demolished.':`${d.desc}. Demolition refunds 35% of construction resources.`;$('sheetDestroy').style.display=type==='hq'?'none':'';$('sheet').classList.add('show')}
canvas.addEventListener('pointerup',e=>handleCell(hit(e.clientX,e.clientY)));
$('inspect').addEventListener('click',()=>{state.mode='inspect';selectedCell=null;renderUI()});$('bulldoze').addEventListener('click',()=>{state.mode=state.mode==='bulldoze'?'build':'bulldoze';selectedCell=null;renderUI();$('bulldoze').classList.toggle('active',state.mode==='bulldoze')});$('sheetClose').addEventListener('click',()=>{$('sheet').classList.remove('show');selectedCell=null});$('sheetDestroy').addEventListener('click',()=>{if(!selectedCell)return;const type=state.grid[selectedCell.index];if(type&&type!=='hq'){refund(type);state.grid[selectedCell.index]=null;save();renderUI()}$('sheet').classList.remove('show');selectedCell=null});$('reset').addEventListener('click',()=>{if(!confirm('Start a new city? Your current city will be erased.'))return;state=defaultState();state.grid[3*N+3]='hq';save();renderUI();showToast('New city started')});
setInterval(()=>{const r=rates();state.credits+=r.credits;state.wood+=r.wood;state.food+=r.food;renderUI();checkLevel();save()},1000);
window.addEventListener('resize',resize);resize();renderBuildbar();renderUI();render();
})();
</script>
</body>
</html>
