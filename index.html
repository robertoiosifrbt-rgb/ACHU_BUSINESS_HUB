<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>BUILD // v0.1</title>
  <style>
    :root { color-scheme: dark; --bg:#08101b; --panel:#0f1a2a; --panel-2:#142238; --line:#243754; --text:#eef5ff; --muted:#8fa3bd; --accent:#5aa8ff; --good:#54d49b; --bad:#ff6f7d; --tile:#102033; --tile-hover:#18304c; --shadow:0 16px 40px rgba(0,0,0,.28); }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(59,130,246,.12),transparent 34%),linear-gradient(180deg,#08101b 0%,#0b1422 100%);color:var(--text)}
    button{font:inherit} button:focus-visible{outline:3px solid rgba(90,168,255,.5);outline-offset:2px}.app{width:min(100%,980px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand h1{margin:0;font-size:clamp(22px,5vw,34px);letter-spacing:-.04em}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.ghost{min-height:44px;border:1px solid var(--line);background:rgba(15,26,42,.8);color:var(--text);border-radius:14px;padding:0 14px;cursor:pointer}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.stat{background:rgba(15,26,42,.9);border:1px solid var(--line);border-radius:16px;padding:10px 11px;min-width:0;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.stat-value{margin-top:4px;font-size:clamp(16px,4vw,22px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-rate{margin-top:2px;color:var(--good);font-size:11px;min-height:1em}
    .objective{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(90,168,255,.14),rgba(84,212,155,.08));border:1px solid rgba(90,168,255,.3);border-radius:16px;padding:11px 13px;margin-bottom:10px}.objective strong{display:block;font-size:13px}.objective span{color:var(--muted);font-size:12px}.level{flex:0 0 auto;font-weight:900;color:var(--accent)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px;align-items:start}.world-card,.build-card{border:1px solid var(--line);background:rgba(15,26,42,.88);border-radius:20px;box-shadow:var(--shadow)}.world-card{padding:10px}.world-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;min-height:30px}.world-head strong{font-size:13px}.mode{color:var(--muted);font-size:12px;text-align:right}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;aspect-ratio:1;width:100%;touch-action:manipulation}.tile{position:relative;border:1px solid #23405f;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 45%),var(--tile);color:var(--text);padding:0;cursor:pointer;overflow:hidden;min-width:0}.tile.empty::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:rgba(143,163,189,.2);font-size:19px}.tile-icon{font-size:clamp(17px,4.2vw,30px);line-height:1;display:block}.tile-name{position:absolute;left:3px;right:3px;bottom:4px;font-size:clamp(7px,1.7vw,10px);color:rgba(238,245,255,.82);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile.hq{background:linear-gradient(145deg,#18365b,#102338);border-color:#3975b8}.tile.house{background:linear-gradient(145deg,#273149,#172235)}.tile.lumber{background:linear-gradient(145deg,#18372d,#12261f);border-color:#285642}.tile.farm{background:linear-gradient(145deg,#394020,#292f18);border-color:#56632b}.tile.market{background:linear-gradient(145deg,#493324,#2e211a);border-color:#6a4930}
    .build-card{padding:10px}.build-title{margin:2px 2px 9px;font-size:13px}.build-list{display:grid;gap:7px}.build-btn{width:100%;min-height:58px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:14px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}.build-btn.active{border-color:var(--accent);background:rgba(90,168,255,.13)}.build-btn.locked{opacity:.45;cursor:not-allowed}.build-emoji{font-size:24px}.build-name{font-weight:800;font-size:13px}.build-cost,.build-yield{font-size:11px;margin-top:2px;display:block}.build-cost{color:var(--muted)}.build-yield{color:var(--good)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.tool{min-height:46px;border:1px solid var(--line);background:#111d2f;color:var(--text);border-radius:13px;cursor:pointer}.tool.active{border-color:var(--bad);color:#ffd9de;background:rgba(255,111,125,.1)}.feed{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;min-height:38px;color:var(--muted);font-size:12px;line-height:1.4}.toast{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));margin:10px auto 0;width:fit-content;max-width:100%;background:#17253a;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:12px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.16s ease}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:720px){.app{padding-left:10px;padding-right:10px}.layout{grid-template-columns:1fr}.build-card{order:-1}.build-list{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.build-btn{grid-template-columns:1fr;text-align:center;min-height:78px;padding:7px 4px}.build-emoji{font-size:22px}.build-cost,.build-yield{font-size:9px}.feed{display:none}}@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}.build-name{font-size:11px}.world-card{padding:7px}.grid{gap:3px}.tile{border-radius:7px}}@media(hover:hover) and (pointer:fine){.tile:hover{background-color:var(--tile-hover);transform:translateY(-1px)}.build-btn:hover:not(.locked),.tool:hover,.ghost:hover{border-color:#3b5c83}}
  </style>
</head>
<body>
<main class="app">
  <div class="topbar"><div class="brand"><h1>BUILD</h1><p>city builder prototype · v0.1</p></div><button id="resetBtn" class="ghost" type="button">New city</button></div>
  <section class="stats" aria-label="Resources">
    <div class="stat"><div class="stat-label">Credits</div><div id="credits" class="stat-value">0</div><div id="creditsRate" class="stat-rate"></div></div>
    <div class="stat"><div class="stat-label">Wood</div><div id="wood" class="stat-value">0</div><div id="woodRate" class="stat-rate"></div></div>
    <div class="stat"><div class="stat-label">Food</div><div id="food" class="stat-value">0</div><div id="foodRate" class="stat-rate"></div></div>
    <div class="stat"><div class="stat-label">Population</div><div id="population" class="stat-value">0</div><div id="populationRate" class="stat-rate"></div></div>
  </section>
  <section class="objective"><div><strong id="objectiveTitle">Build your first house</strong><span id="objectiveText">Expand the settlement and unlock the market.</span></div><div id="level" class="level">LV 1</div></section>
  <div class="layout">
    <section class="world-card"><div class="world-head"><strong>Your settlement</strong><div id="modeText" class="mode">Select a building, then tap a tile.</div></div><div id="grid" class="grid" role="grid" aria-label="City grid"></div></section>
    <aside class="build-card"><h2 class="build-title">Build</h2><div id="buildList" class="build-list"></div><div class="tools"><button id="inspectBtn" type="button" class="tool">Inspect</button><button id="demolishBtn" type="button" class="tool">Demolish</button></div><div id="feed" class="feed">HQ online. Start building.</div></aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const STORAGE_KEY='build-v01-save', SIZE=7;
  const defs={house:{name:'House',icon:'🏠',cost:{credits:40,wood:20},yield:{population:4},text:'+4 population',unlock:1},lumber:{name:'Lumber',icon:'🌲',cost:{credits:25},yield:{wood:2},text:'+2 wood/s',unlock:1},farm:{name:'Farm',icon:'🌾',cost:{credits:35,wood:10},yield:{food:2},text:'+2 food/s',unlock:1},market:{name:'Market',icon:'🏪',cost:{credits:120,wood:35,food:30},yield:{credits:4},text:'+4 credits/s',unlock:2}};
  const $=id=>document.getElementById(id), els={grid:$('grid'),buildList:$('buildList'),credits:$('credits'),wood:$('wood'),food:$('food'),population:$('population'),creditsRate:$('creditsRate'),woodRate:$('woodRate'),foodRate:$('foodRate'),populationRate:$('populationRate'),level:$('level'),objectiveTitle:$('objectiveTitle'),objectiveText:$('objectiveText'),modeText:$('modeText'),inspectBtn:$('inspectBtn'),demolishBtn:$('demolishBtn'),resetBtn:$('resetBtn'),feed:$('feed'),toast:$('toast')};
  function fresh(){const cells=Array(SIZE*SIZE).fill(null);cells[Math.floor(cells.length/2)]={type:'hq'};return{version:1,resources:{credits:160,wood:70,food:40,population:6},cells,selected:'house',mode:'build'}}
  function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY));return p&&p.version===1&&Array.isArray(p.cells)&&p.cells.length===SIZE*SIZE?p:fresh()}catch{return fresh()}}
  let state=load(),toastTimer; const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  function counts(){const o={house:0,lumber:0,farm:0,market:0,hq:0};state.cells.forEach(c=>{if(c&&o[c.type]!==undefined)o[c.type]++});return o}
  function levelOf(){const c=counts();if(c.market>=2&&state.resources.population>=20)return 3;if(c.house>=2&&c.lumber>=1&&c.farm>=1)return 2;return 1}
  function rates(){const c=counts();return{credits:c.market*4+1,wood:c.lumber*2,food:c.farm*2}}
  function costText(c){return[['credits','¢'],['wood',' wood'],['food',' food']].filter(([k])=>c[k]).map(([k,s])=>`${c[k]}${s}`).join(' · ')}
  const canAfford=c=>Object.entries(c).every(([k,v])=>(state.resources[k]||0)>=v);
  function notify(m){els.toast.textContent=m;els.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1700)}
  function build(i){if(state.cells[i])return notify('That tile is occupied.');const d=defs[state.selected];if(d.unlock>levelOf())return;if(!canAfford(d.cost))return notify(`Not enough resources for ${d.name}.`);Object.entries(d.cost).forEach(([k,v])=>state.resources[k]-=v);state.cells[i]={type:state.selected};if(d.yield.population)state.resources.population+=d.yield.population;save();els.feed.textContent=`${d.name} completed.`;render()}
  function demolish(i){const c=state.cells[i];if(!c)return notify('Nothing to demolish.');if(c.type==='hq')return notify('HQ cannot be demolished.');const d=defs[c.type];if(c.type==='house')state.resources.population=Math.max(0,state.resources.population-4);Object.entries(d.cost).forEach(([k,v])=>state.resources[k]=(state.resources[k]||0)+Math.floor(v*.35));state.cells[i]=null;save();els.feed.textContent=`${d.name} demolished. 35% recovered.`;render()}
  function inspect(i){const c=state.cells[i];if(!c)return notify('Empty land.');if(c.type==='hq')return notify('HQ · settlement command centre');const d=defs[c.type];notify(`${d.name} · ${d.text}`)}
  function tileClick(i){state.mode==='demolish'?demolish(i):state.mode==='inspect'?inspect(i):build(i)}
  function select(type){state.selected=type;state.mode='build';save();render()}
  function renderGrid(){els.grid.innerHTML='';state.cells.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className=`tile ${c?c.type:'empty'}`;b.setAttribute('role','gridcell');const label=c?(c.type==='hq'?'HQ':defs[c.type].name):`Empty tile ${i+1}`;b.setAttribute('aria-label',label);if(c){b.innerHTML=`<span class="tile-icon">${c.type==='hq'?'🏢':defs[c.type].icon}</span><span class="tile-name">${label}</span>`}b.addEventListener('click',()=>tileClick(i));els.grid.appendChild(b)})}
  function renderBuild(){els.buildList.innerHTML='';const lv=levelOf();Object.entries(defs).forEach(([t,d])=>{const locked=d.unlock>lv,b=document.createElement('button');b.type='button';b.disabled=locked;b.className=`build-btn${state.mode==='build'&&state.selected===t?' active':''}${locked?' locked':''}`;b.innerHTML=`<span class="build-emoji">${d.icon}</span><span><span class="build-name">${d.name}${locked?` · LV ${d.unlock}`:''}</span><span class="build-cost">${costText(d.cost)}</span><span class="build-yield">${d.text}</span></span>`;b.addEventListener('click',()=>select(t));els.buildList.appendChild(b)})}
  function renderResources(){const r=state.resources,q=rates();els.credits.textContent=Math.floor(r.credits);els.wood.textContent=Math.floor(r.wood);els.food.textContent=Math.floor(r.food);els.population.textContent=Math.floor(r.population);els.creditsRate.textContent=`+${q.credits}/s`;els.woodRate.textContent=q.wood?`+${q.wood}/s`:'—';els.foodRate.textContent=q.food?`+${q.food}/s`:'—';els.populationRate.textContent='capacity'}
  function renderObjective(){const c=counts(),lv=levelOf();els.level.textContent=`LV ${lv}`;if(lv===1){els.objectiveTitle.textContent='Reach settlement level 2';els.objectiveText.textContent=`Need 2 Houses, 1 Lumber and 1 Farm · ${c.house}/2 · ${c.lumber}/1 · ${c.farm}/1`}else if(lv===2){els.objectiveTitle.textContent='Turn the settlement into a town';els.objectiveText.textContent=`Build 2 Markets and reach 20 population · ${c.market}/2 · ${Math.floor(state.resources.population)}/20`}else{els.objectiveTitle.textContent='Town established';els.objectiveText.textContent='v0.1 objective complete. Keep expanding.'}}
  function renderMode(){els.modeText.textContent=state.mode==='demolish'?'Demolish mode · tap a building.':state.mode==='inspect'?'Inspect mode · tap a building.':`${defs[state.selected].name} selected · tap empty land.`;els.inspectBtn.classList.toggle('active',state.mode==='inspect');els.demolishBtn.classList.toggle('active',state.mode==='demolish')}
  function render(){renderResources();renderObjective();renderBuild();renderGrid();renderMode()}
  els.inspectBtn.addEventListener('click',()=>{state.mode=state.mode==='inspect'?'build':'inspect';render()});els.demolishBtn.addEventListener('click',()=>{state.mode=state.mode==='demolish'?'build':'demolish';render()});els.resetBtn.addEventListener('click',()=>{if(!confirm('Start a new city?'))return;state=fresh();save();els.feed.textContent='New settlement created.';render()});
  setInterval(()=>{const q=rates();state.resources.credits+=q.credits;state.resources.wood+=q.wood;state.resources.food+=q.food;save();renderResources();renderObjective();renderBuild()},1000);render();
})();
</script>
</body>
</html>
