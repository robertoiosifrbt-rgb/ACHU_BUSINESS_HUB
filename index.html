<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#8fcaf0" />
<title>BUILD — v0.1</title>
<style>
:root{color-scheme:light;--ink:#16324a;--muted:#6e8799;--line:#c8dbe7;--card:rgba(255,255,255,.92);--blue:#217ed0;--danger:#c95050;--shadow:0 12px 34px rgba(36,77,105,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:linear-gradient(#bfe6fb,#eff9ff 46%,#d9efd9);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100vh;overflow-x:hidden}.app{width:min(100%,1040px);margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(22px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:9px}.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:23px;letter-spacing:-.045em}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}.resources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}.res{background:var(--card);border:1px solid rgba(200,219,231,.95);border-radius:15px;padding:8px 9px;box-shadow:var(--shadow);min-width:0}.res span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.res b{display:block;margin-top:2px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res i{display:block;min-height:11px;font-size:9px;font-style:normal;color:#2b9662}.mission{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;background:rgba(255,255,255,.9);border:1px solid rgba(200,219,231,.95);border-radius:15px;padding:9px 11px;box-shadow:var(--shadow)}.mission strong{font-size:12px}.mission small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.mission b{font-size:11px;color:var(--blue);white-space:nowrap}.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(101,153,184,.45);box-shadow:0 20px 50px rgba(42,85,112,.19);background:#8fcdf1}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:1.44;touch-action:manipulation}.stage-note{position:absolute;top:10px;left:10px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.88);backdrop-filter:blur(8px);font-size:10px;color:#557086;pointer-events:none}.buildbar{display:flex;gap:7px;overflow-x:auto;padding:9px 2px 4px;scrollbar-width:none}.buildbar::-webkit-scrollbar{display:none}.build{flex:0 0 128px;min-height:70px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);padding:9px 10px;text-align:left;color:var(--ink)}.build.active{border:2px solid var(--blue);padding:8px 9px;background:#f5fbff}.build .mini{display:block;width:30px;height:18px;margin-bottom:5px;position:relative}.build .mini:before,.build .mini:after{content:"";position:absolute}.mini.house:before{left:5px;top:6px;width:20px;height:11px;background:#f2dfc4;border:1px solid #b58a67}.mini.house:after{left:3px;top:1px;width:23px;height:10px;background:#b95848;clip-path:polygon(50% 0,100% 55%,82% 100%,18% 100%,0 55%)}.mini.lumber:before{left:5px;top:6px;width:21px;height:11px;background:#9d6940;border:1px solid #684329}.mini.lumber:after{left:2px;top:2px;width:27px;height:7px;background:#415d36;transform:skewX(-28deg)}.mini.farm:before{left:1px;top:4px;width:28px;height:13px;background:repeating-linear-gradient(90deg,#d4bd45 0 3px,#6f9d45 3px 6px);transform:skewY(-14deg)}.mini.farm:after{right:1px;top:0;width:8px;height:10px;background:#aa5945}.mini.market:before{left:4px;top:7px;width:22px;height:10px;background:#e8d4a8;border:1px solid #9d805f}.mini.market:after{left:2px;top:1px;width:26px;height:9px;background:repeating-linear-gradient(90deg,#d94e4e 0 6px,#f4eee1 6px 12px);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.mini.road:before{left:2px;top:4px;width:27px;height:12px;background:#a7a39c;transform:skewY(-15deg);border:1px solid #7e7b76}.build strong{display:block;font-size:11px}.build small{display:block;color:var(--muted);font-size:9px;line-height:1.3;margin-top:2px}.toolbar{display:flex;gap:7px;margin-top:5px}.tool{flex:1;min-height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);color:var(--ink);font-size:11px;font-weight:800}.tool.active{border-color:#e0a0a0;color:var(--danger);background:#fff4f4}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);background:#fff;border-radius:23px 23px 0 0;box-shadow:0 -20px 60px rgba(34,67,89,.24);padding:14px 14px max(18px,env(safe-area-inset-bottom));z-index:8;display:none}.sheet.show{display:block}.grab{width:38px;height:4px;border-radius:99px;background:#d7e2e8;margin:0 auto 10px}.sheet h3{margin:0;font-size:16px}.sheet p{margin:5px 0 12px;color:var(--muted);font-size:11px}.sheet-actions{display:flex;gap:8px}.sheet button{flex:1;min-height:44px;border-radius:13px;border:1px solid var(--line);background:#f8fbfd;color:var(--ink);font-weight:800}.sheet .destroy{border-color:#efc1c1;background:#fff3f3;color:var(--danger)}.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:12;max-width:88%;text-align:center;background:rgba(20,48,70,.94);color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;transition:.16s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.resources{grid-template-columns:repeat(2,1fr)}.stage{border-radius:20px}.build{flex-basis:115px}.brand h1{font-size:21px}}@media(min-width:760px){.app{padding-left:18px;padding-right:18px}.brand h1{font-size:28px}.res b{font-size:19px}.buildbar{justify-content:center}.build{flex-basis:145px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>BUILD</h1><p>Isometric settlement · v0.1</p></div><div class="pill" id="levelPill">Level 1</div></div>
  <div class="resources">
    <div class="res"><span>Credits</span><b id="credits">0</b><i id="creditsRate"></i></div>
    <div class="res"><span>Wood</span><b id="wood">0</b><i id="woodRate"></i></div>
    <div class="res"><span>Food</span><b id="food">0</b><i id="foodRate"></i></div>
    <div class="res"><span>Population</span><b id="population">0</b><i id="populationRate"></i></div>
  </div>
  <div class="mission"><div><strong id="missionTitle">Found your settlement</strong><small id="missionText">Build two houses.</small></div><b id="missionProgress">0 / 2</b></div>
  <div class="stage"><canvas id="game" width="960" height="665" aria-label="Isometric city building game"></canvas><div class="stage-note" id="stageNote">Choose a building, then tap a green tile.</div></div>
  <div class="buildbar" id="buildbar">
    <button class="build" data-build="house"><span class="mini house"></span><strong>House</strong><small>80 credits · 45 wood<br>+4 population</small></button>
    <button class="build" data-build="lumber"><span class="mini lumber"></span><strong>Lumber yard</strong><small>120 credits · 65 wood<br>+2 wood / sec</small></button>
    <button class="build" data-build="farm"><span class="mini farm"></span><strong>Farm</strong><small>100 credits · 35 wood<br>+2 food / sec</small></button>
    <button class="build" data-build="market"><span class="mini market"></span><strong>Market</strong><small>190 credits · 85 wood<br>+5 credits / sec</small></button>
    <button class="build" data-build="road"><span class="mini road"></span><strong>Stone road</strong><small>10 credits<br>Decoration</small></button>
  </div>
  <div class="toolbar"><button class="tool" id="cancelBuild">Cancel selection</button><button class="tool" id="resetGame">New settlement</button></div>
</div>
<div class="sheet" id="sheet"><div class="grab"></div><h3 id="sheetTitle"></h3><p id="sheetText"></p><div class="sheet-actions"><button id="sheetClose">Close</button><button class="destroy" id="sheetDestroy">Demolish</button></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const N=9,TW=74,TH=38,OX=480,OY=184,DEPTH=18,SAVE_KEY='build_v01_polished';
const defs={
 house:{label:'House',cost:{credits:80,wood:45},refund:{credits:28,wood:16}},
 lumber:{label:'Lumber yard',cost:{credits:120,wood:65},refund:{credits:42,wood:23}},
 farm:{label:'Farm',cost:{credits:100,wood:35},refund:{credits:35,wood:12}},
 market:{label:'Market',cost:{credits:190,wood:85},refund:{credits:66,wood:30}},
 road:{label:'Stone road',cost:{credits:10},refund:{credits:3}}
};
const missions=[
 {level:1,title:'Found your settlement',text:'Build two houses.',kind:'house',need:2},
 {level:2,title:'Secure supplies',text:'Build a lumber yard and a farm.',kind:'supply',need:2},
 {level:3,title:'Create an economy',text:'Build a market.',kind:'market',need:1},
 {level:4,title:'Settlement established',text:'Keep expanding your town.',kind:'all',need:12}
];
let state={credits:560,wood:220,food:160,world:Array.from({length:N},()=>Array(N).fill(null)),level:1,selected:null,selectedTile:null};
state.world[4][4]='hq';state.world[4][3]='road';state.world[4][5]='road';state.world[3][4]='road';state.world[5][4]='road';
let hover=null,lastTick=performance.now(),toastTimer=0,cloudPhase=0;
const villagers=[{p:0.10,s:.000035,row:4,col:4},{p:.43,s:.000028,row:4,col:4},{p:.72,s:.000031,row:4,col:4},{p:.9,s:.000025,row:4,col:4}];
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||!Array.isArray(x.world)||x.world.length!==N)return;state={...state,...x,selected:null,selectedTile:null};}catch(_){}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({...state,selected:null,selectedTile:null}));}catch(_){}}
function iso(r,c){return{x:OX+(c-r)*TW/2,y:OY+(c+r)*TH/2};}
function poly(points,fill,stroke=null,w=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();}}
function line(points,stroke,w=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();}
function hash(r,c,k=0){const x=Math.sin((r*91.7+c*177.3+k*33.1)*12.9898)*43758.5453;return x-Math.floor(x);}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function diamond(x,y,w,h,fill,stroke=null){poly([[x,y-h/2],[x+w/2,y],[x,y+h/2],[x-w/2,y]],fill,stroke);}
function prism(x,y,w,d,h,top,left,right,stroke='rgba(55,71,68,.22)'){
 poly([[x,y-h-d/2],[x+w/2,y-h],[x,y-h+d/2],[x-w/2,y-h]],top,stroke);
 poly([[x-w/2,y-h],[x,y-h+d/2],[x,y+d/2],[x-w/2,y]],left,stroke);
 poly([[x+w/2,y-h],[x,y-h+d/2],[x,y+d/2],[x+w/2,y]],right,stroke);
}
function roof(x,y,w,d,h,colorL,colorR,colorTop){
 poly([[x-w/2-4,y-h],[x,y-h-d/2-17],[x,y-h+3],[x-w/2-4,y+3]],colorL,'rgba(90,55,45,.25)');
 poly([[x+w/2+4,y-h],[x,y-h-d/2-17],[x,y-h+3],[x+w/2+4,y+3]],colorR,'rgba(90,55,45,.25)');
 line([[x-w/2-4,y-h],[x,y-h-d/2-17],[x+w/2+4,y-h]],colorTop,2);
}
function drawSky(t){
 const g=ctx.createLinearGradient(0,0,0,520);g.addColorStop(0,'#8dcef2');g.addColorStop(.53,'#d9f1fb');g.addColorStop(.54,'#b4d49a');g.addColorStop(1,'#89b779');ctx.fillStyle=g;ctx.fillRect(0,0,960,665);
 ctx.fillStyle='#9cc8a2';ctx.beginPath();ctx.moveTo(0,350);for(let x=0;x<=960;x+=80)ctx.lineTo(x,315+Math.sin(x*.014)*25+Math.cos(x*.006)*18);ctx.lineTo(960,480);ctx.lineTo(0,480);ctx.fill();
 ctx.fillStyle='#7fae80';ctx.beginPath();ctx.moveTo(0,380);for(let x=0;x<=960;x+=55)ctx.lineTo(x,348+Math.sin(x*.022+1.2)*18+Math.cos(x*.009)*22);ctx.lineTo(960,500);ctx.lineTo(0,500);ctx.fill();
 cloudPhase=t*.006;for(let i=0;i<5;i++){let x=((i*225+cloudPhase*18)%1250)-140,y=68+i*27;ctx.globalAlpha=.28;ellipse(x,y,42,14,'#fff');ellipse(x+35,y-8,33,17,'#fff');ellipse(x+65,y,38,13,'#fff');ctx.globalAlpha=1;}
 ctx.fillStyle='#8bc8da';ctx.fillRect(0,500,960,165);for(let i=0;i<12;i++){ctx.globalAlpha=.09;line([[0,520+i*13],[960,515+i*13]],'#fff',2);ctx.globalAlpha=1;}
}
function drawIslandBase(){
 const top=iso(0,0),right=iso(0,N-1),bottom=iso(N-1,N-1),left=iso(N-1,0);
 poly([[top.x,top.y],[right.x+TW/2,right.y],[bottom.x,bottom.y+TH/2+DEPTH],[left.x-TW/2,left.y]],'#7e633e');
 poly([[right.x+TW/2,right.y],[bottom.x,bottom.y+TH/2],[bottom.x,bottom.y+TH/2+DEPTH],[right.x+TW/2,right.y+DEPTH]],'#72583a');
 poly([[left.x-TW/2,left.y],[bottom.x,bottom.y+TH/2],[bottom.x,bottom.y+TH/2+DEPTH],[left.x-TW/2,left.y+DEPTH]],'#8a6d46');
}
function drawTile(r,c){
 const p=iso(r,c),v=hash(r,c);let fill=v>.67?'#78ad59':v>.35?'#82b861':'#74a855';
 if(state.world[r][c]==='road')fill='#a9a49a';
 diamond(p.x,p.y,TW-1,TH-1,fill,'rgba(58,91,50,.28)');
 if(state.world[r][c]!=='road'){
  ctx.globalAlpha=.18;for(let k=0;k<3;k++){const a=hash(r,c,k+5),b=hash(r,c,k+15);ellipse(p.x+(a-.5)*38,p.y+(b-.5)*13,1.2,0.8,'#285f31');}ctx.globalAlpha=1;
 }else{
  ctx.globalAlpha=.22;line([[p.x-25,p.y],[p.x,p.y+12],[p.x+25,p.y]],'#6f6d67',1);line([[p.x,p.y-13],[p.x,p.y+13]],'#d7d3c9',1);ctx.globalAlpha=1;
 }
 const isHover=hover&&hover.r===r&&hover.c===c;
 if(isHover){diamond(p.x,p.y,TW-5,TH-5,state.selected?'rgba(71,170,236,.22)':'rgba(255,255,255,.18)',state.selected?'#3ca1e5':'#eef8ff');}
}
function drawTree(r,c,slot=0){
 const p=iso(r,c),dx=(hash(r,c,slot+40)-.5)*32,dy=(hash(r,c,slot+50)-.5)*10,x=p.x+dx,y=p.y+dy;
 ellipse(x+5,y+5,10,4,'rgba(30,58,36,.18)');ctx.fillStyle='#735338';ctx.fillRect(x-2,y-20,4,20);ellipse(x,y-27,11,9,'#356c3f');ellipse(x-7,y-20,10,8,'#407d47');ellipse(x+8,y-19,9,8,'#2f6638');ellipse(x,y-36,8,7,'#4c8c50');
}
function drawHouse(r,c){const p=iso(r,c),x=p.x,y=p.y-4;ellipse(x+6,y+10,32,9,'rgba(40,60,46,.18)');prism(x,y,46,25,31,'#f5e5c9','#d9c39f','#ead7b6');roof(x,y-1,55,31,31,'#a54e43','#c45d4e','#7e3c35');ctx.fillStyle='#694d39';ctx.fillRect(x-4,y-25,8,25);ctx.fillStyle='#8ad2ef';ctx.fillRect(x+10,y-27,8,8);ctx.fillRect(x-19,y-19,7,7);ctx.fillStyle='#6a3d32';ctx.fillRect(x+14,y-64,5,17);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(x+11,y-26,2,5);}
function drawLumber(r,c){const p=iso(r,c),x=p.x,y=p.y+1;ellipse(x+5,y+7,35,8,'rgba(40,60,46,.18)');prism(x,y,50,28,27,'#c39158','#8e623b','#a97242');poly([[x-30,y-27],[x,y-48],[x+30,y-27],[x,y-9]],'#475e37','#31442b');ctx.fillStyle='#432d20';ctx.fillRect(x-5,y-22,10,22);for(let i=0;i<3;i++){ctx.strokeStyle='#6e4729';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x+22+i*2,y+4-i*4);ctx.lineTo(x+41+i*2,y-5-i*4);ctx.stroke();ellipse(x+42+i*2,y-5-i*4,3.3,3,'#c18b52');}}
function drawFarm(r,c){const p=iso(r,c),x=p.x,y=p.y;ellipse(x+2,y+9,35,8,'rgba(40,60,46,.16)');for(let i=-3;i<=3;i++){const off=i*6;line([[x-30+off*.3,y-1+off*.12],[x+2+off*.3,y+15+off*.12]],i%2?'#d6bd45':'#6e9845',3);}prism(x+21,y-8,26,17,26,'#ddb980','#c39264','#d1a574');roof(x+21,y-8,31,21,26,'#9e4c42','#b85b4d','#763b35');ctx.fillStyle='#684536';ctx.fillRect(x+17,y-29,8,21);ctx.fillStyle='#f3d868';ellipse(x-17,y-4,7,3,'#e3cb52');}
function drawMarket(r,c){const p=iso(r,c),x=p.x,y=p.y;ellipse(x+2,y+9,35,8,'rgba(40,60,46,.17)');prism(x,y+1,49,29,17,'#e9d8b7','#d2bb95','#dfc9a6');for(let i=-1;i<=1;i++){const xx=x+i*15;poly([[xx-10,y-18],[xx,y-27],[xx+10,y-18],[xx,y-9]],i===0?'#f1eee5':'#ce554f','#9f6b61');ctx.strokeStyle='#73533d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx-6,y-11);ctx.lineTo(xx-6,y+5);ctx.moveTo(xx+6,y-11);ctx.lineTo(xx+6,y+5);ctx.stroke();}ctx.fillStyle='#8a5b35';ctx.fillRect(x-28,y+1,8,6);ctx.fillRect(x+20,y+2,9,6);}
function drawHQ(r,c){const p=iso(r,c),x=p.x,y=p.y+3;ellipse(x+4,y+8,47,11,'rgba(35,54,43,.22)');prism(x,y,62,37,48,'#e3e8e5','#b7c3c0','#cbd5d2');prism(x-27,y-15,24,19,67,'#dbe3e1','#aebbb8','#c5d0cd');prism(x+27,y-15,24,19,67,'#dbe3e1','#aebbb8','#c5d0cd');roof(x-27,y-15,29,24,67,'#315f85','#3f78a5','#244d6e');roof(x+27,y-15,29,24,67,'#315f85','#3f78a5','#244d6e');roof(x,y-1,68,43,48,'#3b6e96','#4a83ad','#285777');ctx.fillStyle='#5f493c';ctx.fillRect(x-6,y-37,12,37);ctx.fillStyle='#8ed4ec';for(const dx of[-21,13])ctx.fillRect(x+dx,y-40,8,10);ctx.fillStyle='#2d6ba0';ctx.fillRect(x-31,y-92,4,30);poly([[x-27,y-92],[x-10,y-87],[x-27,y-80]],'#f4cc4c');}
function drawBuilding(r,c,type){if(type==='hq')drawHQ(r,c);else if(type==='house')drawHouse(r,c);else if(type==='lumber')drawLumber(r,c);else if(type==='farm')drawFarm(r,c);else if(type==='market')drawMarket(r,c);}
function drawDecorations(){
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(state.world[r][c])continue;const edge=r===0||c===0||r===N-1||c===N-1;if(edge&&hash(r,c)>.34)drawTree(r,c,0);else if(hash(r,c)>.82)drawTree(r,c,1);}
}
function drawVillagers(t){
 const anchors=[[4,3],[3,4],[4,5],[5,4],[4,4]];
 villagers.forEach((v,i)=>{v.p=(v.p+v.s*16)%1;const a=anchors[i%4],b=anchors[(i+1)%4];const pa=iso(a[0],a[1]),pb=iso(b[0],b[1]),q=(Math.sin(t*.00035+i*1.7)+1)/2,x=pa.x+(pb.x-pa.x)*q,y=pa.y+(pb.y-pa.y)*q-5;ellipse(x+2,y+3,4,2,'rgba(30,50,35,.18)');ctx.fillStyle=i%2?'#426d9e':'#9a5949';ctx.fillRect(x-2,y-8,4,8);ellipse(x,y-10,3,3,'#e1b188');});
}
function render(t){
 drawSky(t);drawIslandBase();
 for(let s=0;s<=2*(N-1);s++)for(let r=0;r<N;r++){const c=s-r;if(c<0||c>=N)continue;drawTile(r,c);}
 drawDecorations();
 for(let s=0;s<=2*(N-1);s++)for(let r=0;r<N;r++){const c=s-r;if(c<0||c>=N)continue;const type=state.world[r][c];if(type&&type!=='road')drawBuilding(r,c,type);}
 drawVillagers(t);
 if(state.selectedTile){const p=iso(state.selectedTile.r,state.selectedTile.c);diamond(p.x,p.y,TW-8,TH-8,'rgba(255,255,255,.08)','#fff');}
 requestAnimationFrame(render);
}
function counts(){const out={house:0,lumber:0,farm:0,market:0,road:0,total:0};for(const row of state.world)for(const t of row)if(t&&t!=='hq'){out.total++;if(out[t]!==undefined)out[t]++;}return out;}
function rates(){const c=counts();return{credits:c.market*5,wood:c.lumber*2,food:c.farm*2,pop:8+c.house*4};}
function missionStatus(){const m=missions[Math.min(state.level-1,missions.length-1)],c=counts();let cur=0;if(m.kind==='house')cur=c.house;if(m.kind==='supply')cur=Math.min(1,c.lumber)+Math.min(1,c.farm);if(m.kind==='market')cur=c.market;if(m.kind==='all')cur=c.total;return{m,cur};}
function advance(){let changed=false;while(state.level<missions.length){const x=missionStatus();if(x.cur<x.m.need)break;state.level++;state.credits+=120;state.wood+=60;changed=true;toast('Level up — resources awarded');}if(changed)save();}
function updateHud(){advance();const r=rates(),m=missionStatus();credits.textContent=Math.floor(state.credits);wood.textContent=Math.floor(state.wood);food.textContent=Math.floor(state.food);population.textContent=r.pop;creditsRate.textContent=r.credits?`+${r.credits}/sec`:'';woodRate.textContent=r.wood?`+${r.wood}/sec`:'';foodRate.textContent=r.food?`+${r.food}/sec`:'';populationRate.textContent='capacity';levelPill.textContent=`Level ${state.level}`;missionTitle.textContent=m.m.title;missionText.textContent=m.m.text;missionProgress.textContent=`${Math.min(m.cur,m.m.need)} / ${m.m.need}`;}
function canAfford(def){return Object.entries(def.cost).every(([k,v])=>state[k]>=v);}
function buildAt(r,c){if(!state.selected||state.world[r][c])return;if((r===0||c===0||r===N-1||c===N-1)&&state.selected!=='road'){toast('Build closer to the settlement center');return;}const def=defs[state.selected];if(!canAfford(def)){toast('Not enough resources');return;}for(const[k,v]of Object.entries(def.cost))state[k]-=v;state.world[r][c]=state.selected;toast(`${def.label} built`);save();updateHud();}
function inspect(r,c){const type=state.world[r][c];if(!type)return;state.selectedTile={r,c};sheetTitle.textContent=type==='hq'?'Town Hall':defs[type]?.label||type;sheetText.textContent=type==='hq'?'The heart of your settlement. It cannot be demolished.':type==='road'?'A stone road connecting the settlement.':`${defs[type].label} is active and contributing to your settlement.`;sheetDestroy.style.display=type==='hq'?'none':'';sheet.classList.add('show');}
function demolish(){if(!state.selectedTile)return;const{r,c}=state.selectedTile,type=state.world[r][c];if(!type||type==='hq')return;const ref=defs[type]?.refund||{};for(const[k,v]of Object.entries(ref))state[k]+=v;state.world[r][c]=null;sheet.classList.remove('show');state.selectedTile=null;toast('Building demolished — partial refund');save();updateHud();}
function pointerToTile(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height,dx=(x-OX)/(TW/2),dy=(y-OY)/(TH/2),c=Math.round((dy+dx)/2),r=Math.round((dy-dx)/2);if(r<0||c<0||r>=N||c>=N)return null;return{r,c};}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500);}
function selectBuild(type){state.selected=state.selected===type?null:type;document.querySelectorAll('.build').forEach(b=>b.classList.toggle('active',b.dataset.build===state.selected));stageNote.textContent=state.selected?`Placing ${defs[state.selected].label} — tap an empty tile.`:'Choose a building, then tap a green tile.';}
document.getElementById('buildbar').addEventListener('click',e=>{const b=e.target.closest('.build');if(b)selectBuild(b.dataset.build);});
document.getElementById('cancelBuild').addEventListener('click',()=>selectBuild(null));
document.getElementById('resetGame').addEventListener('click',()=>{if(!confirm('Start a new settlement?'))return;localStorage.removeItem(SAVE_KEY);location.reload();});
document.getElementById('sheetClose').addEventListener('click',()=>{sheet.classList.remove('show');state.selectedTile=null;});
document.getElementById('sheetDestroy').addEventListener('click',demolish);
canvas.addEventListener('pointermove',e=>{hover=pointerToTile(e);});canvas.addEventListener('pointerleave',()=>hover=null);
canvas.addEventListener('pointerdown',e=>{const t=pointerToTile(e);if(!t)return;hover=t;if(state.selected)buildAt(t.r,t.c);else inspect(t.r,t.c);});
setInterval(()=>{const r=rates();state.credits+=r.credits;state.wood+=r.wood;state.food+=r.food;updateHud();},1000);
setInterval(save,5000);
load();updateHud();requestAnimationFrame(render);
})();
</script>
</body>
