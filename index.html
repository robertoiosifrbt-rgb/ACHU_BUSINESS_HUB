<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91bad5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button{font:inherit;color:inherit}.game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#87b6d7,#d9edf7 46%,#eaf5f7)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(8px,env(safe-area-inset-top)) 8px 0;pointer-events:none}.profile-row{display:flex;align-items:center;gap:7px;padding:0 7px}.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #f4d99d;background:radial-gradient(circle at 50% 32%,#f5d8b0 0 16%,#72513e 17% 27%,#2f4b61 28% 100%);box-shadow:0 3px 10px rgba(0,0,0,.35)}.profile{min-width:0}.name{font-size:13px;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.5)}.power{font-size:10px;color:#d8ecfa;text-shadow:0 2px 3px rgba(0,0,0,.55)}.spacer{flex:1}.temp{padding:6px 9px;border:1px solid var(--line);background:rgba(12,29,44,.76);border-radius:999px;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}.resources{pointer-events:auto;margin-top:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 7px}.res{background:rgba(9,24,38,.78);border:1px solid var(--line);border-radius:10px;padding:5px 6px;backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(0,0,0,.18)}.res small{display:block;font-size:8px;color:#b9d4e5;text-transform:uppercase;letter-spacing:.05em}.res b{display:block;font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queues{position:absolute;z-index:5;left:8px;top:118px;width:min(48vw,205px);display:grid;gap:5px;pointer-events:none}.queue{display:none;background:rgba(12,28,42,.88);border:1px solid var(--line);border-radius:11px;padding:7px 8px;box-shadow:0 5px 18px rgba(0,0,0,.22);backdrop-filter:blur(8px);pointer-events:auto}.queue.show{display:block}.queue-head{display:flex;justify-content:space-between;gap:6px;font-size:9px;font-weight:800}.queue-sub{font-size:8px;color:#b9d4e5;margin-top:2px}.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fc8ff,#8cf0c0)}.queue button{border:0;border-radius:8px;background:#315d79;padding:4px 7px;font-size:8px;font-weight:800;margin-top:5px}.quest{position:absolute;z-index:5;left:8px;top:220px;width:min(50vw,210px);background:rgba(13,30,45,.78);border:1px solid var(--line);border-radius:12px;padding:8px 9px;box-shadow:0 5px 18px rgba(0,0,0,.18);backdrop-filter:blur(7px);pointer-events:none}.quest b{font-size:10px}.quest span{display:block;font-size:8px;color:#c0d9e8;margin-top:2px}.side{position:absolute;z-index:5;right:7px;top:128px;display:grid;gap:7px}.side button{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:rgba(13,30,46,.83);box-shadow:0 5px 15px rgba(0,0,0,.25);font-size:17px}.side small{position:absolute;display:none}.bottom{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:0 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:linear-gradient(transparent,rgba(4,15,25,.56) 35%,rgba(4,15,25,.84));padding-top:28px}.nav{min-height:52px;border:1px solid rgba(219,238,249,.18);border-radius:12px;background:linear-gradient(rgba(40,72,94,.93),rgba(20,42,60,.96));box-shadow:0 5px 15px rgba(0,0,0,.28);font-size:18px;font-weight:800}.nav span{display:block;font-size:8px;margin-top:2px}.nav.research{border-color:rgba(121,201,255,.65);box-shadow:0 0 0 1px rgba(121,201,255,.15),0 5px 15px rgba(0,0,0,.28)}.sheet{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%) translateY(105%);width:min(100%,520px);max-height:78vh;background:linear-gradient(#213e55,#102a3e);border:1px solid rgba(221,239,250,.2);border-radius:22px 22px 0 0;box-shadow:0 -18px 55px rgba(0,0,0,.42);padding:10px 12px max(16px,env(safe-area-inset-bottom));transition:.18s ease;overflow:auto}.sheet.show{transform:translateX(-50%) translateY(0)}.grab{width:38px;height:4px;background:#7895a8;border-radius:99px;margin:0 auto 9px}.sheet h2{margin:0;font-size:18px}.sheet .meta{font-size:10px;color:#b8d1e1;margin-top:3px}.reqs,.costs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{border:1px solid rgba(215,235,247,.18);border-radius:999px;background:rgba(255,255,255,.07);padding:5px 7px;font-size:9px}.chip.ok{border-color:rgba(119,225,173,.5);color:#aaf1ca}.chip.bad{border-color:rgba(255,141,141,.45);color:#ffc1c1}.sheet-card{margin-top:9px;border:1px solid rgba(217,237,249,.14);border-radius:13px;background:rgba(5,19,30,.27);padding:9px}.sheet-card strong{font-size:10px}.sheet-card p{font-size:9px;color:#c2d9e8;margin:4px 0 0;line-height:1.4}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;min-height:44px;border-radius:12px;border:1px solid rgba(224,240,250,.2);background:#315f7d;font-weight:900;font-size:11px}.actions .primary{background:linear-gradient(#f2c96d,#d99e39);color:#283543;border-color:#fbe1a7}.actions button:disabled{opacity:.42;filter:grayscale(.5)}.research-panel{position:fixed;inset:0;z-index:18;background:linear-gradient(rgba(5,18,29,.91),rgba(11,31,46,.97));transform:translateY(105%);transition:.2s ease;padding:max(12px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));overflow:auto}.research-panel.show{transform:translateY(0)}.r-head{display:flex;align-items:center;gap:8px}.r-head h2{margin:0;flex:1;font-size:19px}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#294c65}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.tab{border:1px solid var(--line);border-radius:10px;background:#17354b;min-height:38px;font-size:10px;font-weight:900}.tab.active{background:#3f7191;border-color:#8ecff4}.techs{display:grid;gap:8px}.tech{display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;border:1px solid rgba(218,237,249,.15);border-radius:14px;background:rgba(255,255,255,.06);padding:8px}.tech.locked{opacity:.48}.tech-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#76a9c7,#31546d);border:2px solid rgba(228,243,252,.35);font-size:20px}.tech b{font-size:11px}.tech p{font-size:8px;color:#bcd4e4;margin:3px 0 0}.tech button{border:1px solid rgba(240,224,174,.35);background:#795f2f;border-radius:9px;min-height:34px;padding:0 9px;font-size:9px;font-weight:900}.tech button:disabled{opacity:.45}.toast{position:fixed;z-index:50;left:50%;bottom:84px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:rgba(7,19,30,.94);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:10px;transition:.16s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.resources{max-width:520px;margin-left:auto;margin-right:auto}.profile-row{max-width:780px;margin:auto}.quest{top:190px}.queues{top:112px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:20px 20px 0 0}.side{right:18px}}

<body>
<div class="game">
<canvas id="game"></canvas>
<div class="top">
  <div class="profile-row"><div class="avatar"></div><div class="profile"><div class="name">ACHU • Chief</div><div class="power" id="power">Power 0</div></div><div class="spacer"></div><div class="temp">❄ -18°C · DEMO ×120</div></div>
  <div class="resources">
    <div class="res"><small>🥩 Meat</small><b id="meat">0</b></div><div class="res"><small>🪵 Wood</small><b id="wood">0</b></div><div class="res"><small>🪨 Coal</small><b id="coal">0</b></div><div class="res"><small>⚙ Iron</small><b id="iron">0</b></div>
  </div>
</div>
<div class="queues"><div class="queue" id="buildQueue"><div class="queue-head"><span id="bqName">Building</span><span id="bqTime">0:00</span></div><div class="queue-sub" id="bqSub"></div><div class="bar"><i id="bqBar"></i></div><button id="helpBuild">Alliance Help</button></div><div class="queue" id="researchQueue"><div class="queue-head"><span id="rqName">Research</span><span id="rqTime">0:00</span></div><div class="queue-sub" id="rqSub"></div><div class="bar"><i id="rqBar"></i></div><button id="helpResearch">Alliance Help</button></div></div>
<div class="quest"><b id="questTitle">Raise the Furnace</b><span id="questText">Bring Embassy to Lv. 8, then upgrade Furnace to Lv. 9.</span></div>
<div class="side"><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="centerMap">⌂</button></div>
<div class="bottom"><button class="nav" id="buildNav">🏗<span>BUILD</span></button><button class="nav research" id="researchNav">🔬<span>RESEARCH</span></button><button class="nav">🛡<span>ARMY</span></button><button class="nav">🎒<span>BAG</span></button><button class="nav">🌐<span>WORLD</span></button></div>
</div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sheetTitle"></h2><div class="meta" id="sheetMeta"></div><div class="reqs" id="reqs"></div><div class="costs" id="costs"></div><div class="sheet-card"><strong id="bonusTitle">Effect</strong><p id="bonusText"></p></div><div class="actions"><button id="closeSheet">Close</button><button class="primary" id="upgradeBtn">Upgrade</button></div></div>
<div class="research-panel" id="researchPanel"><div class="r-head"><h2>Research Center</h2><button class="close" id="closeResearch">×</button></div><div class="meta" id="researchMeta"></div><div class="tabs"><button class="tab active" data-tab="growth">GROWTH</button><button class="tab" data-tab="economy">ECONOMY</button><button class="tab" data-tab="battle">BATTLE</button></div><div class="techs" id="techs"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d');
const WORLD={w:1000,h:1450};
const TIME_SCALE=120;
const B={
 furnace:{name:'Furnace',desc:'Town HQ. Its level caps other buildings and unlocks new systems.',x:500,y:620,lv:8,icon:'🔥'},
 embassy:{name:'Embassy',desc:'Alliance building. Higher levels increase Alliance Helps and reinforce capacity.',x:325,y:790,lv:7,icon:'🤝'},
 infirmary:{name:'Infirmary',desc:'Treats wounded troops. Capacity rises with building level and Growth research.',x:675,y:790,lv:1,icon:'✚'},
 infantry:{name:'Infantry Camp',desc:'Trains Infantry. Building level is capped by Furnace.',x:285,y:510,lv:7,icon:'🛡'},
 marksman:{name:'Marksman Camp',desc:'Trains Marksmen. Required for several Furnace milestones.',x:715,y:510,lv:8,icon:'🏹'},
 sawmill:{name:'Sawmill',desc:'Produces Wood for construction.',x:195,y:995,lv:7,icon:'🪵'},
 coal:{name:'Coal Mine',desc:'Produces Coal for higher level upgrades.',x:805,y:1005,lv:7,icon:'🪨'},
 research:{name:'Research Center',desc:'Unlocks Growth, Economy and Battle technology trees at Furnace Lv. 9.',x:500,y:1025,lv:0,icon:'🔬'}
};
const FURNACE={
 9:{req:[['embassy',8],['infirmary',1]],cost:{wood:260000,coal:52000,iron:13000},base:16200,power:11700},
 10:{req:[['marksman',9],['research',1]],cost:{wood:460000,coal:92000,iron:23000},base:21600,power:17000}
};
const BUILD_POWER={embassy:396,infirmary:270,infantry:520,marksman:520,sawmill:260,coal:300,research:440};
const TECHS={
 growth:[
  {id:'tooling',name:'Tooling Up I',icon:'🛠',max:3,needRC:1,bonus:'+5% construction speed / level',effect:'buildSpeed',step:.05,base:90,cost:{meat:29000,wood:29000,coal:5700,iron:1400}},
  {id:'toolEnhance',name:'Tool Enhancement I',icon:'⚙',max:3,needRC:1,bonus:'+5% research speed / level',effect:'researchSpeed',step:.05,base:120,cost:{meat:32000,wood:32000,coal:6400,iron:1600},requires:['tooling',1]},
  {id:'ward',name:'Ward Expansion I',icon:'✚',max:3,needRC:2,bonus:'+8% infirmary capacity / level',effect:'ward',step:.08,base:150,cost:{meat:37000,wood:37000,coal:7400,iron:1800}},
  {id:'trainer',name:'Trainer Tools I',icon:'⏱',max:3,needRC:3,bonus:'+5% training speed / level',effect:'trainSpeed',step:.05,base:180,cost:{meat:42000,wood:42000,coal:8400,iron:2100},requires:['toolEnhance',1]}
 ],
 economy:[
  {id:'meatOut',name:'Meat Output I',icon:'🥩',max:3,needRC:1,bonus:'+10% Meat output / level',effect:'meatOutput',step:.10,base:120,cost:{meat:29000,wood:29000,coal:5700,iron:1400}},
  {id:'woodOut',name:'Wood Output I',icon:'🪵',max:3,needRC:1,bonus:'+10% Wood output / level',effect:'woodOutput',step:.10,base:120,cost:{meat:29000,wood:29000,coal:5700,iron:1400}},
  {id:'coalOut',name:'Coal Output I',icon:'🪨',max:3,needRC:2,bonus:'+10% Coal output / level',effect:'coalOutput',step:.10,base:150,cost:{meat:35000,wood:35000,coal:7000,iron:1700},requires:['woodOut',1]},
  {id:'ironOut',name:'Iron Output I',icon:'⚙',max:3,needRC:3,bonus:'+10% Iron output / level',effect:'ironOutput',step:.10,base:180,cost:{meat:42000,wood:42000,coal:8400,iron:2100},requires:['coalOut',1]}
 ],
 battle:[
  {id:'infAtk',name:'Infantry Attack I',icon:'🛡',max:3,needRC:2,bonus:'+2% Infantry Attack / level',effect:'infAtk',step:.02,base:180,cost:{meat:50000,wood:50000,coal:10000,iron:2500}},
  {id:'lanAtk',name:'Lancer Attack I',icon:'⚔',max:3,needRC:2,bonus:'+2% Lancer Attack / level',effect:'lanAtk',step:.02,base:180,cost:{meat:50000,wood:50000,coal:10000,iron:2500}},
  {id:'markAtk',name:'Marksman Attack I',icon:'🏹',max:3,needRC:2,bonus:'+2% Marksman Attack / level',effect:'markAtk',step:.02,base:180,cost:{meat:50000,wood:50000,coal:10000,iron:2500}},
  {id:'march',name:'Regimental Expansion I',icon:'🚩',max:1,needRC:4,bonus:'+500 march capacity',effect:'march',step:500,base:300,cost:{meat:90000,wood:90000,coal:18000,iron:4500},requires:['infAtk',1]}
 ]
};
const SAVE='frostbound_wos_v02';
let state={res:{meat:950000,wood:950000,coal:220000,iron:70000},power:318420,buildings:Object.fromEntries(Object.entries(B).map(([k,v])=>[k,v.lv])),tech:{},buildQ:null,researchQ:null,helps:{build:0,research:0}};
let cam={x:500,y:760,z:0.68},drag=null,hits=[],selected=null,activeTab='growth',toastTimer=0,last=performance.now();
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE));if(x&&x.res&&x.buildings)state={...state,...x};}catch(_){}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state));}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2).replace(/\.0+$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'K';return Math.floor(n).toString()}
function timeFmt(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h)return`${h}h ${String(m).padStart(2,'0')}m`;return`${m}:${String(sec).padStart(2,'0')}`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function techLevel(id){return state.tech[id]||0}
function bonus(effect){let v=0;for(const list of Object.values(TECHS))for(const t of list)if(t.effect===effect)v+=techLevel(t.id)*t.step;return v}
function buildSpeed(){return bonus('buildSpeed')}
function researchSpeed(){return bonus('researchSpeed')+(state.buildings.research||0)*.001}
function canPay(cost){return Object.entries(cost).every(([k,v])=>(state.res[k]||0)>=v)}
function pay(cost){for(const[k,v]of Object.entries(cost))state.res[k]-=v}
function buildingDef(id){return B[id]}
function genericUpgrade(id,to){const mult=Math.pow(1.43,Math.max(0,to-2));const base={embassy:60,infirmary:55,infantry:80,marksman:80,sawmill:45,coal:55,research:105}[id]||70;const wood=Math.round(base*mult*100);const coal=to>=4?Math.round(wood*.2):0;const iron=to>=6?Math.round(wood*.05):0;return{req:[['furnace',Math.max(id==='research'?9:1,to)]],cost:{wood, ...(coal?{coal}:{}), ...(iron?{iron}:{})},base:Math.round((to*to*18+25)*Math.max(1,to/3)),power:Math.round((BUILD_POWER[id]||300)*Math.pow(1.18,to-1))}}
function upgradeData(id){const cur=state.buildings[id]||0,to=cur+1;if(id==='furnace')return FURNACE[to]||null;if(id==='research'&&cur===0)return{req:[['furnace',9]],cost:{wood:105},base:2,power:440};return genericUpgrade(id,to)}
function reqStatus(req){return req.map(([id,lv])=>({id,lv,ok:(state.buildings[id]||0)>=lv,name:B[id]?.name||id}))}
function startBuild(id){const d=upgradeData(id);if(!d)return toast('No higher prototype level yet.');const req=reqStatus(d.req||[]);if(req.some(r=>!r.ok))return toast('Prerequisites not met.');if(state.buildQ)return toast('Builder is already busy.');if(!canPay(d.cost))return toast('Not enough resources.');pay(d.cost);const cur=state.buildings[id]||0;const eff=d.base/(1+buildSpeed());const demo=Math.max(1,eff/TIME_SCALE);state.buildQ={id,to:cur+1,start:Date.now(),end:Date.now()+demo*1000,demo,base:d.base,power:d.power||0,helped:0};save();closeSheet();toast(`${B[id].name} upgrade started.`)}
function finishBuild(){const q=state.buildQ;if(!q)return;state.buildings[q.id]=q.to;state.power+=q.power||0;state.buildQ=null;state.helps.build=0;save();toast(`${B[q.id].name} reached Lv. ${q.to}.`);renderHUD()}
function startResearch(t){if(state.researchQ)return toast('Research queue is busy.');const lv=techLevel(t.id);if(lv>=t.max)return toast('Technology maxed.');if((state.buildings.research||0)<t.needRC)return toast(`Research Center Lv. ${t.needRC} required.`);if(t.requires&&techLevel(t.requires[0])<t.requires[1])return toast(`Requires ${findTech(t.requires[0]).name} Lv. ${t.requires[1]}.`);const scale=lv+1,cost=Object.fromEntries(Object.entries(t.cost).map(([k,v])=>[k,Math.round(v*Math.pow(1.55,lv))]));if(!canPay(cost))return toast('Not enough resources.');pay(cost);const base=t.base*Math.pow(1.7,lv),eff=base/(1+researchSpeed()),demo=Math.max(1,eff/TIME_SCALE);state.researchQ={id:t.id,name:t.name,to:lv+1,start:Date.now(),end:Date.now()+demo*1000,demo,base,power:3500*(lv+1),helped:0};save();renderResearch();toast(`${t.name} started.`)}
function finishResearch(){const q=state.researchQ;if(!q)return;state.tech[q.id]=q.to;state.power+=q.power;state.researchQ=null;state.helps.research=0;save();toast(`${q.name} Lv. ${q.to} complete.`);renderResearch();renderHUD()}
function findTech(id){for(const list of Object.values(TECHS)){const t=list.find(x=>x.id===id);if(t)return t}return null}
function help(which){const q=which==='build'?state.buildQ:state.researchQ;if(!q)return;const max=Math.max(1,state.buildings.embassy||0);const key=which==='build'?'build':'research';if((state.helps[key]||0)>=max)return toast('No Alliance Helps remaining.');const rem=q.end-Date.now();const cut=Math.max(1000,Math.min(rem*.12,10000));q.end-=cut;state.helps[key]=(state.helps[key]||0)+1;save();toast(`Alliance Help -${timeFmt(cut/1000)}.`)}
function resize(){const dpr=Math.min(2,devicePixelRatio||1),r=C.getBoundingClientRect();C.width=Math.round(r.width*dpr);C.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function screenWorld(){const r=C.getBoundingClientRect();return{w:r.width,h:r.height}}
function worldToScreen(x,y){const {w,h}=screenWorld();return{x:(x-cam.x)*cam.z+w/2,y:(y-cam.y)*cam.z+h/2}}
function drawRounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawTree(x,y,s=1){const p=worldToScreen(x,y),z=cam.z*s;ctx.save();ctx.translate(p.x,p.y);ctx.scale(z,z);ctx.fillStyle='rgba(17,47,63,.20)';ctx.beginPath();ctx.ellipse(12,18,22,8,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#543c2f';ctx.fillRect(-3,-2,6,24);for(const [yy,ww,c] of [[-40,26,'#214c55'],[-24,35,'#285b62'],[-7,43,'#2f696c']]){ctx.beginPath();ctx.moveTo(0,yy-22);ctx.lineTo(-ww,yy+20);ctx.lineTo(ww,yy+20);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.fillStyle='rgba(236,249,255,.88)';ctx.beginPath();ctx.moveTo(-ww*.75,yy+5);ctx.quadraticCurveTo(0,yy-5,ww*.72,yy+4);ctx.lineTo(ww*.45,yy+10);ctx.quadraticCurveTo(0,yy+3,-ww*.5,yy+11);ctx.closePath();ctx.fill()}ctx.restore()}
function drawRoad(x1,y1,x2,y2,w=56){const a=worldToScreen(x1,y1),b=worldToScreen(x2,y2);ctx.strokeStyle='rgba(91,111,123,.48)';ctx.lineWidth=w*cam.z;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='rgba(225,237,241,.56)';ctx.lineWidth=(w-15)*cam.z;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function drawBuilding(id){const d=B[id],lv=state.buildings[id]||0,p=worldToScreen(d.x,d.y),z=cam.z,locked=id==='research'&&lv===0&&state.buildings.furnace<9;ctx.save();ctx.translate(p.x,p.y);ctx.scale(z,z);ctx.globalAlpha=locked?.48:1;ctx.fillStyle='rgba(24,55,68,.23)';ctx.beginPath();ctx.ellipse(10,30,80,28,-.1,0,Math.PI*2);ctx.fill();if(id==='furnace'){ctx.fillStyle='#624936';ctx.fillRect(-50,-15,100,65);ctx.fillStyle='#354d55';ctx.fillRect(-60,32,120,14);ctx.fillStyle='#f2c466';ctx.beginPath();ctx.arc(0,-8,28,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a33';ctx.beginPath();ctx.moveTo(-12,8);ctx.quadraticCurveTo(-24,-22,0,-48);ctx.quadraticCurveTo(25,-20,10,9);ctx.closePath();ctx.fill();ctx.fillStyle='#f3f8fb';ctx.beginPath();ctx.moveTo(-58,-16);ctx.lineTo(0,-55);ctx.lineTo(58,-16);ctx.lineTo(38,-3);ctx.lineTo(0,-26);ctx.lineTo(-38,-3);ctx.closePath();ctx.fill()}else if(id==='embassy'){ctx.fillStyle='#516876';ctx.fillRect(-48,-20,96,62);ctx.fillStyle='#dfeef5';ctx.fillRect(-57,-28,114,16);ctx.fillStyle='#b7d4df';ctx.beginPath();ctx.moveTo(-62,-27);ctx.lineTo(0,-64);ctx.lineTo(62,-27);ctx.closePath();ctx.fill();ctx.fillStyle='#d7b95b';ctx.fillRect(-6,-6,12,48)}else if(id==='infirmary'){ctx.fillStyle='#d7e8ef';ctx.fillRect(-50,-20,100,60);ctx.fillStyle='#8aaebd';ctx.beginPath();ctx.moveTo(-58,-20);ctx.lineTo(0,-55);ctx.lineTo(58,-20);ctx.closePath();ctx.fill();ctx.fillStyle='#c95050';ctx.fillRect(-8,-8,16,34);ctx.fillRect(-18,2,36,14)}else if(id==='research'){ctx.fillStyle='#485c6d';ctx.fillRect(-48,-16,96,58);ctx.fillStyle='#dbe9ef';ctx.beginPath();ctx.arc(0,-30,40,Math.PI,0);ctx.lineTo(40,0);ctx.lineTo(-40,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#6bc5ff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,-25,24,Math.PI*1.12,Math.PI*1.88);ctx.stroke();ctx.fillStyle='#79d4ff';ctx.fillRect(-4,-54,8,25)}else if(id==='sawmill'){ctx.fillStyle='#77503a';ctx.fillRect(-54,-15,108,50);ctx.fillStyle='#3e5860';ctx.beginPath();ctx.moveTo(-62,-18);ctx.lineTo(0,-55);ctx.lineTo(62,-18);ctx.closePath();ctx.fill();ctx.fillStyle='#a86f42';for(let i=0;i<4;i++)ctx.fillRect(-47+i*25,24,20,12)}else if(id==='coal'){ctx.fillStyle='#59666d';ctx.fillRect(-52,-12,104,52);ctx.fillStyle='#26373f';ctx.beginPath();ctx.moveTo(-60,-15);ctx.lineTo(0,-50);ctx.lineTo(60,-15);ctx.closePath();ctx.fill();ctx.fillStyle='#262b2e';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-32+i*16,34,8,0,Math.PI*2);ctx.fill()}}else{ctx.fillStyle=id==='infantry'?'#586b72':'#665b61';ctx.fillRect(-52,-18,104,58);ctx.fillStyle=id==='infantry'?'#b7d6e4':'#cfb5bd';ctx.beginPath();ctx.moveTo(-60,-20);ctx.lineTo(0,-57);ctx.lineTo(60,-20);ctx.closePath();ctx.fill();ctx.fillStyle='#d8b660';ctx.fillRect(-8,-5,16,45)}
ctx.globalAlpha=1;ctx.font='900 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#f7fbff';ctx.strokeStyle='rgba(13,34,48,.75)';ctx.lineWidth=5;ctx.strokeText(d.name,0,67);ctx.fillText(d.name,0,67);ctx.font='800 13px system-ui';const label=locked?'LOCKED':(lv?`Lv. ${lv}`:'Build');ctx.strokeText(label,0,85);ctx.fillStyle=locked?'#ffc0c0':'#f6d27a';ctx.fillText(label,0,85);ctx.restore();hits.push({id,x:p.x-70*z,y:p.y-75*z,w:140*z,h:170*z})}
function drawWorld(){const {w,h}=screenWorld();ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#7caed0');sky.addColorStop(.55,'#d7edf7');sky.addColorStop(1,'#eaf4f5');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);const a=worldToScreen(0,0),b=worldToScreen(WORLD.w,WORLD.h);ctx.fillStyle='#e7f2f3';ctx.fillRect(a.x,a.y,(b.x-a.x),(b.y-a.y));ctx.fillStyle='rgba(168,199,211,.17)';for(let y=0;y<WORLD.h;y+=65)for(let x=0;x<WORLD.w;x+=65){const p=worldToScreen(x+(y%130?15:0),y);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,2.2*cam.z),0,Math.PI*2);ctx.fill()}
for(const p of [[500,620,325,790],[500,620,675,790],[500,620,285,510],[500,620,715,510],[325,790,195,995],[675,790,805,1005],[325,790,500,1025],[675,790,500,1025]])drawRoad(...p);
const trees=[[110,430,1],[180,350,.9],[850,390,1.1],[900,520,.9],[95,730,1.05],[910,760,1.1],[125,1180,1.1],[880,1210,1.2],[260,1215,.9],[730,1240,.95],[120,900,.85],[900,940,.9],[420,350,.8],[600,330,.86]];for(const t of trees)drawTree(...t);
hits=[];const order=Object.keys(B).sort((a,b)=>B[a].y-B[b].y);for(const id of order)drawBuilding(id);
if(state.buildQ){const d=B[state.buildQ.id],p=worldToScreen(d.x,d.y-90);ctx.save();ctx.translate(p.x,p.y);drawRounded(-42,-14,84,26,12,'rgba(22,48,66,.88)','rgba(215,235,247,.3)');ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('🔨 '+timeFmt((state.buildQ.end-Date.now())/1000),0,4);ctx.restore()}}
function draw(){drawWorld()}
function hitAt(x,y){return hits.slice().reverse().find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)}
function openBuilding(id){selected=id;const cur=state.buildings[id]||0,d=B[id],up=upgradeData(id),title=document.getElementById('sheetTitle'),meta=document.getElementById('sheetMeta'),reqs=document.getElementById('reqs'),costs=document.getElementById('costs'),btn=document.getElementById('upgradeBtn');title.textContent=d.name;meta.textContent=`Level ${cur} • Furnace cap ${state.buildings.furnace}`;document.getElementById('bonusText').textContent=d.desc;reqs.innerHTML='';costs.innerHTML='';if(!up){reqs.innerHTML='<span class="chip">Prototype cap reached</span>';btn.disabled=true;btn.textContent='Max for v0.2'}else{const rs=reqStatus(up.req||[]);for(const r of rs)reqs.innerHTML+=`<span class="chip ${r.ok?'ok':'bad'}">${r.name} Lv. ${r.lv} ${r.ok?'✓':'✕'}</span>`;for(const[k,v]of Object.entries(up.cost))costs.innerHTML+=`<span class="chip">${k.toUpperCase()} ${fmt(v)}</span>`;const eff=up.base/(1+buildSpeed()),demo=Math.max(1,eff/TIME_SCALE);costs.innerHTML+=`<span class="chip">Base ${timeFmt(up.base)}</span><span class="chip">Demo ${timeFmt(demo)}</span>`;const ok=rs.every(r=>r.ok)&&canPay(up.cost)&&!state.buildQ;btn.disabled=!ok;btn.textContent=cur===0?'Build':'Upgrade'}document.getElementById('sheet').classList.add('show')}
function closeSheet(){document.getElementById('sheet').classList.remove('show')}
function renderResearch(){const rc=state.buildings.research||0;document.getElementById('researchMeta').textContent=rc?`Research Center Lv. ${rc} • Research speed +${(researchSpeed()*100).toFixed(1)}%`:`Locked until Furnace Lv. 9`;const host=document.getElementById('techs');host.innerHTML='';for(const t of TECHS[activeTab]){const lv=techLevel(t.id),need=t.requires?findTech(t.requires[0]):null,locked=rc<t.needRC||(t.requires&&techLevel(t.requires[0])<t.requires[1]);const nextCost=Object.fromEntries(Object.entries(t.cost).map(([k,v])=>[k,Math.round(v*Math.pow(1.55,lv))]));const div=document.createElement('div');div.className='tech'+(locked?' locked':'');div.innerHTML=`<div class="tech-icon">${t.icon}</div><div><b>${t.name} · ${lv}/${t.max}</b><p>${t.bonus}<br>${locked?(rc<t.needRC?`Requires Research Center Lv. ${t.needRC}`:`Requires ${need.name} Lv. ${t.requires[1]}`):Object.entries(nextCost).map(([k,v])=>`${k} ${fmt(v)}`).join(' · ')}</p></div><button ${locked||lv>=t.max||state.researchQ?'disabled':''}>${lv>=t.max?'MAX':'Research'}</button>`;div.querySelector('button').onclick=()=>startResearch(t);host.appendChild(div)}}
function renderHUD(){for(const k of ['meat','wood','coal','iron'])document.getElementById(k).textContent=fmt(state.res[k]);document.getElementById('power').textContent='Power '+fmt(state.power);const f=state.buildings.furnace;if(f<9){document.getElementById('questTitle').textContent='Raise the Furnace';document.getElementById('questText').textContent=`Embassy ${state.buildings.embassy}/8 · Infirmary ${state.buildings.infirmary}/1 · Furnace ${f}/9`}else if(f<10){document.getElementById('questTitle').textContent='Unlock Furnace Lv. 10';document.getElementById('questText').textContent=`Marksman ${state.buildings.marksman}/9 · Research Center ${state.buildings.research}/1`}else{document.getElementById('questTitle').textContent='Settlement advanced';document.getElementById('questText').textContent='Continue buildings and technology research.'}}
function updateQueues(){const now=Date.now(),bq=state.buildQ,rq=state.researchQ,be=document.getElementById('buildQueue'),re=document.getElementById('researchQueue');if(bq){if(now>=bq.end)finishBuild();else{be.classList.add('show');const rem=(bq.end-now)/1000;document.getElementById('bqName').textContent=`🔨 ${B[bq.id].name} → Lv. ${bq.to}`;document.getElementById('bqTime').textContent=timeFmt(rem);document.getElementById('bqSub').textContent=`Base ${timeFmt(bq.base)} • Helps ${state.helps.build||0}/${state.buildings.embassy||0}`;document.getElementById('bqBar').style.width=(100*Math.min(1,(now-bq.start)/(bq.end-bq.start))).toFixed(1)+'%'}}else be.classList.remove('show');if(rq){if(now>=rq.end)finishResearch();else{re.classList.add('show');const rem=(rq.end-now)/1000;document.getElementById('rqName').textContent=`🔬 ${rq.name} → Lv. ${rq.to}`;document.getElementById('rqTime').textContent=timeFmt(rem);document.getElementById('rqSub').textContent=`Base ${timeFmt(rq.base)} • Helps ${state.helps.research||0}/${state.buildings.embassy||0}`;document.getElementById('rqBar').style.width=(100*Math.min(1,(now-rq.start)/(rq.end-rq.start))).toFixed(1)+'%'}}else re.classList.remove('show')}
function tick(t){const dt=Math.min(2,(t-last)/1000);last=t;const eco=1+bonus('woodOutput');state.res.wood+=((state.buildings.sawmill||0)*2.5*eco)*dt;state.res.meat+=(4*(1+bonus('meatOutput')))*dt;state.res.coal+=((state.buildings.coal||0)*.65*(1+bonus('coalOutput')))*dt;state.res.iron+=(0.18*(1+bonus('ironOutput')))*dt;updateQueues();renderHUD();draw();requestAnimationFrame(tick)}
C.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};C.setPointerCapture(e.pointerId)});C.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;cam.x=Math.max(120,Math.min(880,cam.x));cam.y=Math.max(260,Math.min(1220,cam.y));draw()});C.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(!moved){const h=hitAt(e.clientX,e.clientY);if(h)openBuilding(h.id)}});
document.getElementById('upgradeBtn').onclick=()=>selected&&startBuild(selected);document.getElementById('closeSheet').onclick=closeSheet;document.getElementById('researchNav').onclick=()=>{if((state.buildings.research||0)<1)return toast('Build Research Center after Furnace Lv. 9.');renderResearch();document.getElementById('researchPanel').classList.add('show')};document.getElementById('closeResearch').onclick=()=>document.getElementById('researchPanel').classList.remove('show');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderResearch()});document.getElementById('helpBuild').onclick=()=>help('build');document.getElementById('helpResearch').onclick=()=>help('research');document.getElementById('zoomIn').onclick=()=>{cam.z=Math.min(1.15,cam.z+.1);draw()};document.getElementById('zoomOut').onclick=()=>{cam.z=Math.max(.48,cam.z-.1);draw()};document.getElementById('centerMap').onclick=()=>{cam={x:500,y:760,z:.68};draw()};document.getElementById('buildNav').onclick=()=>{cam={x:500,y:760,z:.74};draw();toast('Tap a building to upgrade it.')};
load();renderHUD();resize();addEventListener('resize',resize);requestAnimationFrame(tick);
})();
