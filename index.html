<style>
:root{--glass:rgba(18,34,48,.70);--glass2:rgba(247,252,255,.94);--line:rgba(255,255,255,.28);--ink:#17364d;--gold:#ffd66b;--blue:#5bb9ff;--red:#e26262}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#94c9e4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.game{position:fixed;inset:0;overflow:hidden;background:#8fc5df}#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:max(7px,env(safe-area-inset-top)) 8px 0;pointer-events:none}.player{display:flex;align-items:center;gap:7px;pointer-events:auto;width:max-content;max-width:56vw}.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #ffe69b;background:linear-gradient(145deg,#315977,#173a58);box-shadow:0 3px 12px #0005;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900}.playerbox{min-width:0;background:linear-gradient(90deg,rgba(20,39,56,.88),rgba(20,39,56,.55));border:1px solid rgba(255,255,255,.22);border-radius:7px 14px 14px 7px;padding:5px 10px 5px 8px;color:#fff;box-shadow:0 3px 12px #0003}.playerbox b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerbox small{display:block;color:#d3e7f2;font-size:9px;margin-top:1px}.power{color:#ffe182!important}.resources{position:absolute;right:8px;top:max(7px,env(safe-area-inset-top));display:flex;gap:5px;pointer-events:auto}.resource{height:31px;min-width:57px;padding:3px 7px;border-radius:15px;background:rgba(20,39,56,.78);border:1px solid rgba(255,255,255,.2);box-shadow:0 3px 10px #0003;color:#fff;text-align:center}.resource small{display:block;font-size:7px;color:#bdd4e2;line-height:9px;text-transform:uppercase}.resource b{display:block;font-size:10px;line-height:12px}
.leftRail{position:absolute;z-index:6;left:7px;top:88px;display:grid;gap:7px}.roundBtn,.sideBtn{border:1px solid rgba(255,255,255,.35);background:linear-gradient(#f9fdff,#d7e8f1);box-shadow:0 3px 10px #16354b55;color:#244860}.sideBtn{width:44px;height:44px;border-radius:12px;padding:0;display:grid;place-items:center;font-size:19px;position:relative}.sideBtn span{position:absolute;left:49px;white-space:nowrap;background:rgba(23,48,67,.78);color:#fff;padding:3px 6px;border-radius:6px;font-size:8px;pointer-events:none;opacity:.88}.redDot{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:#ef5252;border:2px solid white}.rightRail{position:absolute;z-index:6;right:7px;top:82px;display:grid;gap:7px}.roundBtn{width:42px;height:42px;border-radius:50%;padding:0;font-size:17px}.objective{position:absolute;z-index:5;left:7px;top:246px;width:min(245px,62vw);padding:8px 9px;background:linear-gradient(90deg,rgba(17,38,56,.82),rgba(17,38,56,.52));border-left:3px solid #ffd56b;border-radius:4px 10px 10px 4px;color:#fff;box-shadow:0 3px 12px #0003}.objective b{font-size:10px;display:block}.objective small{font-size:9px;color:#d8e6ed;display:block;margin-top:2px;line-height:1.25}.objective .progress{height:3px;margin-top:6px;border-radius:4px;background:#ffffff28;overflow:hidden}.objective .progress i{display:block;height:100%;background:#ffd66b;width:0%}
.centerLabel{position:absolute;z-index:4;left:50%;top:35%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:#fff;text-shadow:0 2px 8px #0009;opacity:0;transition:.18s}.centerLabel.show{opacity:1}.centerLabel b{font-size:16px}.centerLabel small{display:block;font-size:10px;margin-top:2px}.bottom{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:0 8px max(7px,env(safe-area-inset-bottom));pointer-events:none}.dock{pointer-events:auto;margin-left:auto;margin-right:auto;max-width:620px;background:linear-gradient(180deg,rgba(246,251,254,.96),rgba(204,221,230,.96));border:1px solid rgba(255,255,255,.75);border-radius:18px 18px 8px 8px;box-shadow:0 -5px 22px rgba(14,37,51,.34);padding:6px 7px 5px}.dockTitle{display:flex;align-items:center;justify-content:space-between;padding:0 3px 5px;color:#38556a}.dockTitle b{font-size:10px}.dockTitle small{font-size:8px;color:#718797}.builds{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.builds::-webkit-scrollbar{display:none}.build{position:relative;flex:0 0 65px;height:59px;border:1px solid #a7bdc9;border-radius:10px;background:linear-gradient(#fff,#dfeaf0);padding:3px;color:#23455d;box-shadow:inset 0 1px white,0 2px 5px #16354b2c}.build.active{outline:2px solid #ffc94f;border-color:#c5952f;background:#fff8df}.build.locked{filter:grayscale(.7);opacity:.55}.build .pic{height:31px;display:grid;place-items:center;font-size:24px;line-height:1}.build b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.build small{display:block;font-size:7px;color:#6b7c87}.miniNav{display:flex;justify-content:center;gap:18px;margin-top:4px}.navBtn{border:0;background:transparent;color:#456275;font-size:8px;padding:2px 5px}.navBtn strong{display:block;font-size:15px;line-height:14px}.toast{position:absolute;z-index:20;left:50%;bottom:98px;transform:translate(-50%,10px);opacity:0;transition:.18s;background:rgba(17,34,47,.91);color:#fff;border:1px solid #ffffff38;border-radius:18px;padding:8px 12px;font-size:10px;max-width:80vw;text-align:center;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.resources{top:max(55px,calc(env(safe-area-inset-top) + 46px));right:7px}.resource{height:27px;min-width:52px}.resource small{font-size:6px}.resource b{font-size:9px}.rightRail{top:126px}.objective{top:265px}.sideBtn span{display:none}.dock{border-radius:15px 15px 6px 6px}.build{flex-basis:61px}}
@media(min-width:800px){.avatar{width:50px;height:50px}.playerbox b{font-size:14px}.resource{min-width:72px;height:34px}.resource b{font-size:12px}.leftRail,.rightRail{gap:9px}.sideBtn,.roundBtn{width:48px;height:48px}.objective{top:270px}.dock{max-width:720px}.build{flex-basis:78px;height:64px}.build .pic{font-size:28px}}
</style>

<body>
<div class="game" id="game">
<canvas id="world" aria-label="Full-screen isometric settlement"></canvas>
<div class="top">
  <div class="player"><div class="avatar">B</div><div class="playerbox"><b>BUILD Settlement</b><small>Furnace Lv. <span id="level">1</span> · <span class="power">⚔ <span id="power">1,240</span></span></small></div></div>
  <div class="resources">
    <div class="resource"><small>Wood</small><b>🪵 <span id="wood">220</span></b></div>
    <div class="resource"><small>Food</small><b>🥩 <span id="food">180</span></b></div>
    <div class="resource"><small>Coins</small><b>🪙 <span id="coins">620</span></b></div>
  </div>
</div>
<div class="leftRail">
  <button class="sideBtn" id="missionBtn">📜<i class="redDot"></i><span>Missions</span></button>
  <button class="sideBtn" id="heroesBtn">🛡️<span>Heroes</span></button>
  <button class="sideBtn" id="bagBtn">🎒<span>Backpack</span></button>
</div>
<div class="rightRail">
  <button class="roundBtn" id="zoomIn">＋</button>
  <button class="roundBtn" id="zoomOut">−</button>
  <button class="roundBtn" id="homeBtn">⌂</button>
</div>
<div class="objective" id="objective"><b id="missionTitle">Grow the settlement</b><small id="missionText">Build 2 shelters around the furnace.</small><div class="progress"><i id="missionBar"></i></div></div>
<div class="centerLabel" id="centerLabel"><b id="labelTitle"></b><small id="labelText"></small></div>
<div class="bottom"><div class="dock">
  <div class="dockTitle"><b>BUILD</b><small>Choose a structure, then tap a highlighted tile</small></div>
  <div class="builds" id="builds">
    <button class="build active" data-type="shelter"><span class="pic">🏠</span><b>Shelter</b><small>80 · 45</small></button>
    <button class="build" data-type="sawmill"><span class="pic">🪚</span><b>Sawmill</b><small>120 · 65</small></button>
    <button class="build" data-type="hunter"><span class="pic">🥩</span><b>Hunter</b><small>100 · 35</small></button>
    <button class="build" data-type="store"><span class="pic">🏪</span><b>Store</b><small>180 · 80</small></button>
    <button class="build" data-type="road"><span class="pic">🪨</span><b>Road</b><small>10</small></button>
  </div>
  <div class="miniNav"><button class="navBtn" id="buildTab"><strong>🔨</strong>Build</button><button class="navBtn" id="inspectTab"><strong>🔍</strong>Inspect</button><button class="navBtn" id="resetTab"><strong>↻</strong>Reset</button></div>
</div></div>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('world'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1),N=11,TW=92,TH=46,SAVE='build_fullscreen_v01';
let W=0,H=0,camX=0,camY=0,zoom=1,selected='shelter',inspect=false,drag=false,moved=false,startX=0,startY=0,baseCamX=0,baseCamY=0,last=performance.now(),toastTimer=0;
const defs={shelter:{name:'Shelter',coins:80,wood:45},sawmill:{name:'Sawmill',coins:120,wood:65},hunter:{name:'Hunter lodge',coins:100,wood:35},store:{name:'Trading post',coins:180,wood:80},road:{name:'Stone road',coins:10,wood:0}};
let s={coins:620,wood:220,food:180,level:1,world:Array.from({length:N},()=>Array(N).fill(null))};
s.world[5][5]='furnace';[[5,4],[5,6],[4,5],[6,5],[4,4],[6,6]].forEach(([r,c])=>s.world[r][c]='road');
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE));if(x&&Array.isArray(x.world)&&x.world.length===N)s=x}catch(_){}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(_){}}
function fit(){W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(!camX&&!camY){camX=W/2;camY=H*.39}}
function iso(r,c){return{x:camX+(c-r)*TW*.5*zoom,y:camY+(c+r-N+1)*TH*.5*zoom}}
function poly(p,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(p,stroke,lw=1){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
function ell(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function hash(a,b,k=0){const q=Math.sin((a*117.13+b*89.31+k*19.77))*43758.54;return q-Math.floor(q)}
function diamond(x,y,fill,stroke=null){const w=TW*zoom,h=TH*zoom;poly([[x,y-h/2],[x+w/2,y],[x,y+h/2],[x-w/2,y]],fill,stroke)}
function box(x,y,w,d,h,top,left,right){poly([[x,y-h-d/2],[x+w/2,y-h],[x,y-h+d/2],[x-w/2,y-h]],top,'#4c5b5c55');poly([[x-w/2,y-h],[x,y-h+d/2],[x,y+d/2],[x-w/2,y]],left,'#4c5b5c55');poly([[x+w/2,y-h],[x,y-h+d/2],[x,y+d/2],[x+w/2,y]],right,'#4c5b5c55')}
function snowbank(x,y,sc=1){ell(x,y,25*sc,9*sc,'#dbe9ef');ell(x-8*sc,y-4*sc,15*sc,7*sc,'#f7fcff')}
function pine(x,y,sc=1){ctx.fillStyle='#6b5944';ctx.fillRect(x-2*sc,y-13*sc,4*sc,17*sc);poly([[x,y-49*sc],[x-17*sc,y-22*sc],[x+17*sc,y-22*sc]],'#2f5b55');poly([[x,y-38*sc],[x-21*sc,y-12*sc],[x+21*sc,y-12*sc]],'#3a6d62');poly([[x,y-30*sc],[x-20*sc,y-5*sc],[x+20*sc,y-5*sc]],'#4b7b6c');line([[x-13*sc,y-18*sc],[x+8*sc,y-25*sc]],'#dbeef3',3*sc)}
function roof(x,y,w,d,h,a,b){poly([[x-w/2-4,y-h],[x,y-h-d/2-17],[x,y-h+2],[x-w/2-4,y+2]],a,'#6d503f55');poly([[x+w/2+4,y-h],[x,y-h-d/2-17],[x,y-h+2],[x+w/2+4,y+2]],b,'#6d503f55');line([[x-w/2-4,y-h],[x,y-h-d/2-17],[x+w/2+4,y-h]],'#fff9',2)}
function drawBuilding(type,x,y,t){const z=zoom,sh=15*z;ell(x+8*z,y+10*z,30*z,11*z,'#2844572e');if(type==='road'){diamond(x,y,'#9da9ac','#849397');line([[x-27*z,y+6*z],[x+27*z,y-6*z]],'#d4dde0',2*z);return}
 if(type==='furnace'){box(x,y,60*z,36*z,48*z,'#6f8994','#486675','#547584');roof(x,y,68*z,42*z,48*z,'#315a70','#416f84');box(x,y-42*z,20*z,15*z,42*z,'#718792','#415b66','#526b75');const flick=.5+.5*Math.sin(t*.009);ell(x,y-102*z,9*z,17*z,`rgba(255,127,40,${.55+.35*flick})`);ell(x,y-98*z,5*z,10*z,'#ffe072');ctx.fillStyle='#ffd76a';ctx.font=`bold ${9*z}px system-ui`;ctx.textAlign='center';ctx.fillText('FURNACE',x,y+23*z);return}
 if(type==='shelter'){box(x,y,46*z,30*z,29*z,'#c5b598','#a69275','#b8a283');roof(x,y,52*z,34*z,29*z,'#715245','#8c6653');ctx.fillStyle='#ffe69a';ctx.fillRect(x+6*z,y-12*z,7*z,9*z);return}
 if(type==='sawmill'){box(x,y,54*z,32*z,24*z,'#9a7652','#765338','#865f3e');roof(x,y,60*z,36*z,24*z,'#435f52','#547363');for(let i=0;i<3;i++){ctx.strokeStyle='#74503a';ctx.lineWidth=5*z;ctx.beginPath();ctx.moveTo(x-27*z+i*10*z,y+10*z);ctx.lineTo(x-10*z+i*10*z,y-2*z);ctx.stroke()}return}
 if(type==='hunter'){box(x,y,50*z,31*z,25*z,'#bfae86','#958464','#a89470');roof(x,y,56*z,35*z,25*z,'#6f3f36','#865146');ctx.strokeStyle='#dbc594';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(x+18*z,y-24*z);ctx.lineTo(x+27*z,y-39*z);ctx.stroke();return}
 if(type==='store'){box(x,y,58*z,34*z,31*z,'#c5b28d','#97835e','#ad966e');roof(x,y,64*z,38*z,31*z,'#854741','#9b5a4f');ctx.fillStyle='#f4d26e';ctx.fillRect(x-15*z,y-16*z,30*z,5*z);return}}
function drawGround(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#76afd0');g.addColorStop(.43,'#b9dce8');g.addColorStop(.44,'#dbe8ea');g.addColorStop(1,'#b9d1d7');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff66';for(let i=0;i<35;i++){const x=(hash(i,2)*W+t*.006*(.2+hash(i,3)))%(W+80)-40,y=hash(i,7)*H*.55,r=1+hash(i,9)*2;ell(x,y,r,r,'#fff9')}
 const p1=iso(0,0),p2=iso(0,N-1),p3=iso(N-1,N-1),p4=iso(N-1,0);poly([[p1.x,p1.y-TH*zSafe()/2],[p2.x+TW*zSafe()/2,p2.y],[p3.x,p3.y+TH*zSafe()/2],[p4.x-TW*zSafe()/2,p4.y]],'#d8e4e7','#b4c8cc');for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=iso(r,c);diamond(p.x,p.y,(r+c)%2?'#dfeaed':'#e7f0f2','#c4d5d8');if(hash(r,c)>.82&&Math.abs(r-5)+Math.abs(c-5)>3) snowbank(p.x+12*zoom,p.y+5*zoom,.55*zoom)}}
function zSafe(){return zoom}
function render(t){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawGround(t);for(let sum=0;sum<=2*(N-1);sum++)for(let r=0;r<N;r++){const c=sum-r;if(c<0||c>=N)continue;const p=iso(r,c),type=s.world[r][c];if(!type&&hash(r,c,11)>.93&&Math.abs(r-5)+Math.abs(c-5)>4)pine(p.x,p.y-2*zoom,.55*zoom);if(type)drawBuilding(type,p.x,p.y,t)}drawPeople(t);requestAnimationFrame(render)}
function drawPeople(t){const roads=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(s.world[r][c]==='road'||s.world[r][c]==='furnace')roads.push([r,c]);if(!roads.length)return;for(let i=0;i<6;i++){const idx=Math.floor((t*.00008+i*.17)%1*roads.length),rc=roads[idx],p=iso(rc[0],rc[1]),a=(t*.001+i)*.8,dx=Math.sin(a)*8*zoom,dy=Math.cos(a)*4*zoom;ell(p.x+dx,p.y+dy-6*zoom,3*zoom,5*zoom,'#314d60');ell(p.x+dx,p.y+dy-12*zoom,2.5*zoom,2.5*zoom,'#d8a879')}}
function screenToTile(x,y){let best=null,bd=1e9;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=iso(r,c),dx=(x-p.x)/(TW*.5*zoom),dy=(y-p.y)/(TH*.5*zoom),d=Math.abs(dx)+Math.abs(dy);if(d<1&&d<bd){best=[r,c];bd=d}}return best}
function count(type){let n=0;for(const row of s.world)for(const v of row)if(v===type)n++;return n}
function mission(){const a=count('shelter'),b=count('sawmill'),c=count('hunter'),d=count('store');let title,text,pct;if(s.level===1){title='Grow the settlement';text=`Build 2 shelters around the furnace. (${a}/2)`;pct=Math.min(100,a/2*100);if(a>=2){s.level=2;save()}}else if(s.level===2){title='Secure supplies';text=`Build a sawmill and hunter lodge. (${Math.min(1,b)+Math.min(1,c)}/2)`;pct=(Math.min(1,b)+Math.min(1,c))/2*100;if(b&&c){s.level=3;save()}}else if(s.level===3){title='Open trade';text=`Build a trading post. (${d}/1)`;pct=Math.min(100,d*100);if(d){s.level=4;save()}}else{title='Settlement established';text='Expand freely and increase your power.';pct=100}document.getElementById('missionTitle').textContent=title;document.getElementById('missionText').textContent=text;document.getElementById('missionBar').style.width=pct+'%';document.getElementById('level').textContent=s.level}
function rates(){const saw=count('sawmill'),hunt=count('hunter'),store=count('store'),now=performance.now();const dt=Math.min(.05,(now-last)/1000);last=now;s.wood+=saw*1.2*dt;s.food+=hunt*1.1*dt;s.coins+=store*1.5*dt;document.getElementById('wood').textContent=Math.floor(s.wood);document.getElementById('food').textContent=Math.floor(s.food);document.getElementById('coins').textContent=Math.floor(s.coins);document.getElementById('power').textContent=(1240+count('shelter')*180+saw*260+hunt*230+store*350).toLocaleString();mission();if(Math.floor(now/5000)!==Math.floor((now-dt*1000)/5000))save();requestAnimationFrame(rates)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
function buildAt(r,c){if(s.world[r][c]){toast('That tile is occupied.');return}const d=defs[selected];if(!d)return;if(s.coins<d.coins||s.wood<d.wood){toast('Not enough resources.');return}s.coins-=d.coins;s.wood-=d.wood;s.world[r][c]=selected;save();toast(`${d.name} constructed`)}
function inspectAt(r,c){const type=s.world[r][c];if(!type)return;const name=type==='furnace'?'Furnace':defs[type]?.name||type;const el=document.getElementById('centerLabel');document.getElementById('labelTitle').textContent=name;document.getElementById('labelText').textContent=type==='furnace'?`Level ${s.level} · settlement core`:'Tap Reset below to restart the prototype';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
cv.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=e.clientX;startY=e.clientY;baseCamX=camX;baseCamY=camY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>7)moved=true;if(moved){camX=baseCamX+dx;camY=baseCamY+dy}});cv.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(moved)return;const rc=screenToTile(e.clientX,e.clientY);if(!rc)return;if(inspect)inspectAt(...rc);else buildAt(...rc)});cv.addEventListener('pointercancel',()=>drag=false);
document.getElementById('builds').addEventListener('click',e=>{const b=e.target.closest('.build');if(!b)return;selected=b.dataset.type;inspect=false;document.querySelectorAll('.build').forEach(x=>x.classList.toggle('active',x===b));toast('Tap an empty tile to build.')});
document.getElementById('inspectTab').addEventListener('click',()=>{inspect=true;selected=null;document.querySelectorAll('.build').forEach(x=>x.classList.remove('active'));toast('Inspect mode: tap a structure.')});document.getElementById('buildTab').addEventListener('click',()=>{inspect=false;selected='shelter';document.querySelectorAll('.build').forEach(x=>x.classList.toggle('active',x.dataset.type==='shelter'));toast('Build mode.')});
document.getElementById('resetTab').addEventListener('click',()=>{if(!confirm('Start a new settlement?'))return;localStorage.removeItem(SAVE);location.reload()});document.getElementById('zoomIn').addEventListener('click',()=>zoom=Math.min(1.5,zoom+.12));document.getElementById('zoomOut').addEventListener('click',()=>zoom=Math.max(.62,zoom-.12));document.getElementById('homeBtn').addEventListener('click',()=>{zoom=1;camX=W/2;camY=H*.39});['missionBtn','heroesBtn','bagBtn'].forEach(id=>document.getElementById(id).addEventListener('click',()=>toast(id==='missionBtn'?'Current mission shown on the left.':id==='heroesBtn'?'Heroes unlock in a later version.':'Backpack unlocks in a later version.')));
load();addEventListener('resize',fit);fit();mission();requestAnimationFrame(render);requestAnimationFrame(rates);
})();
