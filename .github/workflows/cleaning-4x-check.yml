name: Cleaning 4X Build Check

on:
  push:
    branches:
      - refactor/cleaning-4x-loop-song

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
