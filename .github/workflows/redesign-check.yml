name: Redesign Build Check

on:
  push:
    branches:
      - redesign/game-rebuild
      - fix/v4-real-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

      - name: Install browser test runtime
        if: github.ref == 'refs/heads/fix/v4-real-assets'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated preview
        if: github.ref == 'refs/heads/fix/v4-real-assets'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/achu-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ACHU_BUSINESS_HUB/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/achu-preview.log
          exit 1

      - name: Capture CITY and MARKET
        if: github.ref == 'refs/heads/fix/v4-real-assets'
        run: |
          mkdir -p visual-check
          cat > visual-check/check.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const errors=[]
          const failed=[]
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']})
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1})
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)})
          page.on('pageerror',e=>errors.push(`page: ${e.message}`))
          page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText??'failed'}`))
          page.on('response',r=>{if(r.status()>=400)failed.push(`${r.status()} ${r.url()}`)})

          await page.goto('http://127.0.0.1:4173/ACHU_BUSINESS_HUB/',{waitUntil:'networkidle',timeout:60000})
          await page.waitForTimeout(7000)
          await page.screenshot({path:'visual-check/city.png',fullPage:true})

          const canvasCount=await page.locator('canvas').count()
          const bodyText=(await page.locator('body').innerText()).slice(0,4000)
          const gameError=bodyText.includes('Game Error')

          const market=page.locator('[data-mode="world"]')
          if(await market.count()){
            await market.first().click()
            await page.waitForTimeout(3500)
            await page.screenshot({path:'visual-check/market.png',fullPage:true})
          }

          const report={canvasCount,gameError,errors,failed,bodyText}
          fs.writeFileSync('visual-check/report.json',JSON.stringify(report,null,2))
          console.log(JSON.stringify(report,null,2))
          await browser.close()
          if(gameError||canvasCount<1||errors.length)process.exitCode=1
          EOF
          node visual-check/check.mjs

      - name: Upload visual evidence
        if: always() && github.ref == 'refs/heads/fix/v4-real-assets'
        uses: actions/upload-artifact@v4
        with:
          name: real-assets-visual-check
          path: visual-check
          if-no-files-found: warn
