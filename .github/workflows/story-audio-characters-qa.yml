name: Story Audio Characters QA

on:
  push:
    branches:
      - fix/story-audio-characters
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/achu-story.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ACHU_BUSINESS_HUB/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/achu-story.log
          exit 1
      - name: Verify mobile story audio and humanoid crew
        run: |
          mkdir -p story-qa
          cat > story-qa/check.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']})
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1})
          const errors=[],sameOriginFailures=[];let characterStatus=null,animationStatus=null
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())})
          page.on('pageerror',e=>errors.push(e.message))
          page.on('requestfailed',r=>{if(r.url().startsWith('http://127.0.0.1:4173/'))sameOriginFailures.push(`${r.url()} :: ${r.failure()?.errorText}`)})
          page.on('response',r=>{if(r.url().includes('night-striker.glb'))characterStatus=r.status();if(r.url().includes('universal-animation-library.glb'))animationStatus=r.status()})
          await page.addInitScript(()=>{for(const k of Object.keys(localStorage))if(k.startsWith('build_strategy_'))localStorage.removeItem(k);localStorage.removeItem('achu_business_audio_enabled')})
          await page.goto('http://127.0.0.1:4173/ACHU_BUSINESS_HUB/',{waitUntil:'networkidle',timeout:150000})
          await page.waitForTimeout(3500)
          if(characterStatus!==200)throw new Error(`Humanoid crew model did not load: ${characterStatus}`)
          if(animationStatus!==200)throw new Error(`Humanoid animation library did not load: ${animationStatus}`)
          await page.locator('#company-profile').click();await page.waitForTimeout(250)
          let text=await page.locator('#sheet').innerText()
          for(const required of['COMPANY STORY','YOU STARTED WITH A PROMISE','CURRENT CHAPTER','STORY SO FAR'])if(!text.includes(required))throw new Error(`Company profile missing ${required}`)
          await page.screenshot({path:'story-qa/01-company-story.png',fullPage:true})
          await page.locator('#profile-current-story').click();await page.waitForTimeout(250)
          text=await page.locator('#sheet').innerText()
          for(const required of['STORY','YOUR OBJECTIVE','WHY IT MATTERS','WHEN YOU FINISH','REWARD'])if(!text.includes(required))throw new Error(`Chapter missing ${required}`)
          await page.screenshot({path:'story-qa/02-chapter-story.png',fullPage:true})
          await page.locator('[data-close]').first().click();await page.locator('[data-mode="city"]').click();await page.waitForTimeout(1800)
          await page.screenshot({path:'story-qa/03-real-crew-base.png',fullPage:true})
          await page.locator('#quest').click();await page.waitForTimeout(250)
          text=await page.locator('#sheet').innerText();if(!text.includes('STORY')||!text.includes('YOUR OBJECTIVE'))throw new Error('Base quest no longer opens story')
          await page.locator('[data-close]').first().click();await page.locator('[data-action="more"]').click();await page.waitForTimeout(200)
          text=await page.locator('#sheet').innerText();if(!text.includes('SOUND')||!text.includes('ON · ambient + game effects'))throw new Error('Sound control missing or not enabled by default')
          await page.locator('#more-sound').click();await page.waitForTimeout(150)
          text=await page.locator('#sheet').innerText();if(!text.includes('OFF · tap to enable'))throw new Error('Sound toggle failed')
          const report={characterStatus,animationStatus,errors,sameOriginFailures,story:true,chapter:true,soundToggle:true}
          fs.writeFileSync('story-qa/report.json',JSON.stringify(report,null,2));await browser.close()
          if(errors.length||sameOriginFailures.length)process.exitCode=1
          EOF
          node story-qa/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-audio-characters-mobile-qa
          path: story-qa
          if-no-files-found: warn
