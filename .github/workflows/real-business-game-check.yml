name: Real Business Game Check

on:
  push:
    branches:
      - rebuild/real-business-game
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/achu-real-game.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ACHU_BUSINESS_HUB/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/achu-real-game.log
          exit 1
      - name: Play first job on mobile
        run: |
          mkdir -p business-game-qa
          cat > business-game-qa/check.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']})
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1})
          const errors=[],failed=[]
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())})
          page.on('pageerror',e=>errors.push(e.message))
          page.on('requestfailed',r=>{if(!r.url().includes('fonts.googleapis.com')&&!r.url().includes('fonts.gstatic.com'))failed.push(`${r.url()} :: ${r.failure()?.errorText}`)})
          await page.addInitScript(()=>localStorage.removeItem('achu_real_business_game_v1'))
          await page.goto('http://127.0.0.1:4173/ACHU_BUSINESS_HUB/',{waitUntil:'networkidle',timeout:90000})
          await page.waitForTimeout(2500)
          const expectText=async text=>{if(!(await page.locator(`text=${text}`).count()))throw new Error(`Missing text: ${text}`)}
          await expectText('One chance to look professional')
          await expectText('Sarah Collins')
          await expectText('YOUR QUOTE')
          await page.screenshot({path:'business-game-qa/01-first-lead.png',fullPage:true})
          await page.locator('[data-submit]').click();await page.waitForTimeout(250)
          await expectText('Now you have to deliver')
          await page.locator('[data-plan]').click();await page.waitForTimeout(250)
          await expectText('JOB READY')
          await page.screenshot({path:'business-game-qa/02-job-planned.png',fullPage:true})
          await page.locator('[data-drive]').click();await page.waitForTimeout(1200)
          await expectText('The photos were optimistic')
          await page.locator('[data-problem]').click();await page.waitForTimeout(200)
          await expectText('The oven will push the job over plan')
          await page.locator('[data-choice="quality"]').click();await page.waitForTimeout(200)
          await page.locator('[data-finish]').click();await page.waitForTimeout(250)
          await expectText('FIRST JOB RESULT')
          await expectText('Really thorough')
          await page.screenshot({path:'business-game-qa/03-first-review.png',fullPage:true})
          await page.locator('[data-next]').click();await page.waitForTimeout(200)
          await expectText('Word gets around')
          await expectText('Priya Shah')
          await page.screenshot({path:'business-game-qa/04-word-of-mouth.png',fullPage:true})
          const report={canvas:await page.locator('canvas').count(),errors,failed,body:(await page.locator('body').innerText()).slice(0,7000)}
          fs.writeFileSync('business-game-qa/report.json',JSON.stringify(report,null,2))
          await browser.close()
          if(report.canvas!==1||errors.length||failed.length)process.exitCode=1
          EOF
          node business-game-qa/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-business-game-qa
          path: business-game-qa
          if-no-files-found: warn
