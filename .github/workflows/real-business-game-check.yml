name: Real Business Game Check

on:
  push:
    branches:
      - rebuild/real-business-game
      - rebuild/full-cleaning-company-game
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/achu-real-game.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ACHU_BUSINESS_HUB/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/achu-real-game.log
          exit 1
      - name: Play management loop on mobile
        run: |
          mkdir -p business-game-qa
          cat > business-game-qa/check.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']})
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1})
          const errors=[],failed=[]
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())})
          page.on('pageerror',e=>errors.push(e.message))
          page.on('requestfailed',r=>{if(!r.url().includes('fonts.googleapis.com')&&!r.url().includes('fonts.gstatic.com')&&!r.url().includes('raw.githubusercontent.com'))failed.push(`${r.url()} :: ${r.failure()?.errorText}`)})
          await page.addInitScript(()=>localStorage.removeItem('achu_real_business_game_v2'))
          await page.goto('http://127.0.0.1:4173/ACHU_BUSINESS_HUB/',{waitUntil:'networkidle',timeout:90000})
          await page.waitForTimeout(3000)
          const expectText=async text=>{if(!(await page.getByText(text,{exact:false}).count()))throw new Error(`Missing text: ${text}`)}
          await expectText('Run the operation');await expectText('Sarah Collins');await expectText('LEADS')
          await page.screenshot({path:'business-game-qa/01-today.png',fullPage:true})
          await page.locator('[data-lead="lead-sarah-001"]').click();await page.waitForTimeout(150)
          await expectText('MARKET GUIDE');await expectText('YOUR QUOTE')
          await page.screenshot({path:'business-game-qa/02-quote.png',fullPage:true})
          await page.locator('[data-submit-quote="lead-sarah-001"]').click();await page.waitForTimeout(180)
          await expectText('QUOTE ACCEPTED');await expectText('BOOK THIS DAY')
          await page.locator('[data-schedule-lead="lead-sarah-001"]').first().click();await page.waitForTimeout(180)
          await expectText('PREDICTED QUALITY');await expectText('ASSIGNED CLEANER')
          await page.screenshot({path:'business-game-qa/03-booked-job.png',fullPage:true})
          await page.locator('[data-close]').click();await page.waitForTimeout(100)
          await page.locator('[data-next-day]').click();await page.waitForTimeout(250)
          await expectText('DAY 2');await expectText('new leads')
          await page.screenshot({path:'business-game-qa/04-day-two.png',fullPage:true})
          await page.locator('[data-tab="clients"]').click();await page.waitForTimeout(120)
          await expectText('Sarah Collins');await expectText('LIFETIME VALUE')
          await page.screenshot({path:'business-game-qa/05-clients.png',fullPage:true})
          await page.locator('[data-tab="jobs"]').click();await page.waitForTimeout(100)
          await expectText('COMPLETED');await expectText('Sarah Collins')
          await page.locator('[data-tab="business"]').click();await page.waitForTimeout(100)
          await expectText('People, fleet & systems');await expectText('Maya Patel')
          await page.locator('[data-hire="staff-maya"]').click();await page.waitForTimeout(150)
          await expectText('2/2 staff');await expectText('Maya Patel')
          await page.screenshot({path:'business-game-qa/06-business.png',fullPage:true})
          const report={canvas:await page.locator('canvas').count(),errors,failed,body:(await page.locator('body').innerText()).slice(0,12000)}
          fs.writeFileSync('business-game-qa/report.json',JSON.stringify(report,null,2))
          await browser.close()
          if(report.canvas!==1||errors.length||failed.length)process.exitCode=1
          EOF
          node business-game-qa/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-cleaning-company-game-qa
          path: business-game-qa
          if-no-files-found: warn
